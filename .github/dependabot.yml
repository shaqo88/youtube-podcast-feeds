version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Jerusalem
    open-pull-requests-limit: 5
    groups:
      compatible-python-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "06:20"
      timezone: Asia/Jerusalem
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
