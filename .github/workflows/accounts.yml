name: Validate Account API and Clients
on:
  pull_request:
    paths: ['workers/**', 'podcast_feeds/web/**', 'config/**', 'scripts/check-account-identity.mjs', 'tests/accounts.test.mjs', 'tests/history.test.mjs', 'package*.json', '.github/workflows/accounts.yml']
  push:
    branches: [main]
    paths: ['workers/**', 'podcast_feeds/web/**', 'config/**', 'scripts/check-account-identity.mjs', 'tests/accounts.test.mjs', 'tests/history.test.mjs', 'package*.json', '.github/workflows/accounts.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identity-readiness:
    # Only reviewed main code may run with the account environment credentials.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        account-environment: [preview, production]
    environment: accounts-${{ matrix.account-environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Verify scoped Google OAuth and read-only account lookup
        env:
          ACCOUNTS_ENVIRONMENT: ${{ matrix.account-environment }}
          GOOGLE_ACCOUNT_SERVICE_JSON: ${{ secrets.GOOGLE_ACCOUNT_SERVICE_JSON }}
        run: node scripts/check-account-identity.mjs
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Report credential-backed validation status
        if: github.event_name == 'pull_request'
        run: |
          echo '### Account identity readiness' >> "$GITHUB_STEP_SUMMARY"
          echo 'Not run on pull requests. Credential-backed preview and production identity checks run only on trusted main; this PR result does not establish identity readiness.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Install locked JavaScript dependencies
        run: npm ci --no-audit --no-fund
      - name: Build lazy authentication bundle
        run: npm run build:auth
      - name: Verify D1 authentication, isolation, retries and durable client sync
        run: npm run test:accounts
      - name: Verify intake service
        run: node --test workers/onboarding/test/*.test.mjs
      - name: Preserve compiled bundle for reproducibility review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: compiled-firebase-auth
          path: podcast_feeds/web/firebase-auth.bundle.js
          retention-days: 3
      - name: Verify checked-in authentication bundle
        run: git diff --exit-code -- podcast_feeds/web/firebase-auth.bundle.js
