name: Validate Android Wrapper

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/android.yml
      - android-wrapper/**
      - public/assets/icon-192.png
      - tests/test_android_wrapper_source.py
  pull_request:
    paths:
      - .github/workflows/android.yml
      - android-wrapper/**
      - public/assets/icon-192.png
      - tests/test_android_wrapper_source.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-wrapper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95  # v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699  # v4.0.1

      - name: Install pinned Android SDK components
        shell: pwsh
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Test trusted bridge and wrapper source
        shell: pwsh
        run: |
          .\android-wrapper\test-bridge-policy.ps1
          python -m unittest tests.test_android_wrapper_source

      - name: Build and verify debug APK
        shell: pwsh
        env:
          ANDROID_BUILD_TOOLS_VERSION: 35.0.0
        run: .\android-wrapper\build-apk.ps1 -Configuration debug -VersionCode 14 -VersionName "0.3.8"
