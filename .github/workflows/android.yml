name: Validate Android Wrapper

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/android.yml
      - android-wrapper/**
      - public/assets/icon-192.png
      - tests/test_android_wrapper_source.py
  pull_request:
    paths:
      - .github/workflows/android.yml
      - android-wrapper/**
      - public/assets/icon-192.png
      - tests/test_android_wrapper_source.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-wrapper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9  # v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407  # v3

      - name: Install pinned Android SDK components
        shell: pwsh
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Test trusted bridge and wrapper source
        shell: pwsh
        run: |
          .\android-wrapper\test-bridge-policy.ps1
          python -m unittest tests.test_android_wrapper_source

      - name: Build and verify debug APK
        shell: pwsh
        env:
          ANDROID_BUILD_TOOLS_VERSION: 35.0.0
        run: .\android-wrapper\build-apk.ps1 -Configuration debug -VersionCode 14 -VersionName "0.3.8"
