name: Approve Onboarding Issue

on:
  issues:
    types:
      - labeled
  workflow_dispatch:
    inputs:
      issue:
        description: "Onboarding issue number."
        required: true
      intake_repo:
        description: "Private onboarding intake repository. Leave empty for a legacy public issue."
        required: false
        default: ""

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: repo-writer-main
  cancel-in-progress: false

jobs:
  approve:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.sender.login == github.repository_owner &&
       github.event.label.name == 'approved')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: main

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Deno
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Write YouTube cookies file
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          printf '%s' "$YOUTUBE_COOKIES" > /tmp/yt_cookies.txt
          echo "Cookie file: $(wc -l < /tmp/yt_cookies.txt) lines, $(wc -c < /tmp/yt_cookies.txt) bytes"

      - name: Fetch issue
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue }}
          INTAKE_REPO: ${{ inputs.intake_repo }}
          ONBOARDING_INTAKE_TOKEN: ${{ secrets.ONBOARDING_INTAKE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          issue_repo="${INTAKE_REPO:-$GITHUB_REPOSITORY}"
          if [ -n "$INTAKE_REPO" ]; then
            test -n "$ONBOARDING_INTAKE_TOKEN" || { echo "::error::ONBOARDING_INTAKE_TOKEN is required for private onboarding intake."; exit 1; }
            issue_token="$ONBOARDING_INTAKE_TOKEN"
            echo "ONBOARDING_PRIVATE_INTAKE=true" >> "$GITHUB_ENV"
          else
            issue_token="$GITHUB_TOKEN"
            echo "ONBOARDING_PRIVATE_INTAKE=false" >> "$GITHUB_ENV"
          fi
          echo "ONBOARDING_ISSUE_REPO=$issue_repo" >> "$GITHUB_ENV"
          GH_TOKEN="$issue_token" gh issue view "$ISSUE_NUMBER" --repo "$issue_repo" --json number,title,body,labels,url > issue.json

      - name: Create show config
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue }}
        run: |
          args=()
          if [ "$ONBOARDING_PRIVATE_INTAKE" = "true" ]; then
            args+=(--require-rights-confirmation --omit-issue-url)
          fi
          python -m podcast_feeds.onboard_issue \
            --issue-json issue.json \
            --repo "$ONBOARDING_ISSUE_REPO" \
            --output-env onboarding.env \
            "${args[@]}"
          cat onboarding.env >> "$GITHUB_ENV"

      - name: Prepare artwork
        if: env.ONBOARDING_READY == 'true' && env.ARTWORK_SOURCE_URL != ''
        run: python -m podcast_feeds.prepare_artwork --show "$SHOW_SLUG" --source-url "$ARTWORK_SOURCE_URL"

      - name: Install ffmpeg
        if: env.ONBOARDING_READY == 'true' && env.ONBOARDING_NEEDS_FFMPEG == 'true'
        run: sudo apt-get install -y ffmpeg

      - name: Sync first episodes
        if: env.ONBOARDING_READY == 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python -m podcast_feeds.sync --show "$SHOW_SLUG"

      - name: Build feed
        if: env.ONBOARDING_READY == 'true'
        run: python -m podcast_feeds.build --show "$SHOW_SLUG"

      - name: Validate feed
        if: env.ONBOARDING_READY == 'true'
        run: python -m podcast_feeds.validate --show "$SHOW_SLUG"

      - name: Commit onboarded podcast
        if: env.ONBOARDING_READY == 'true'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue }}
        run: |
          set -euo pipefail
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

          backup_dir="$(mktemp -d)"
          cp -R "shows/$SHOW_SLUG" "$backup_dir/show"

          for attempt in 1 2 3 4 5; do
            echo "Commit/push attempt $attempt for $SHOW_SLUG."
            git fetch origin main

            if [ "$attempt" != "1" ]; then
              git reset --hard origin/main
              rm -rf "shows/$SHOW_SLUG"
              cp -R "$backup_dir/show" "shows/$SHOW_SLUG"
              python -m podcast_feeds.build --show "$SHOW_SLUG"
              python -m podcast_feeds.validate --show "$SHOW_SLUG"
            fi

            git add "shows/$SHOW_SLUG" public
            if git diff --cached --quiet; then
              echo "No onboarding changes to commit."
              exit 0
            fi

            git commit -m "Onboard podcast from issue #$ISSUE_NUMBER"
            if git pull --rebase origin main && git push; then
              exit 0
            fi

            echo "::warning::Commit or push failed. Rebuilding from latest main before retry."
            git rebase --abort || true
            git reset --hard origin/main
            sleep "$((attempt * 10))"
          done

          echo "::error::Unable to push onboarding changes after 5 attempts."
          exit 1

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
        if: env.ONBOARDING_READY == 'true'

      - name: Prepare public site
        if: env.ONBOARDING_READY == 'true'
        run: cp -R public public-dist

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        if: env.ONBOARDING_READY == 'true'
        with:
          path: public-dist

      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
        if: env.ONBOARDING_READY == 'true'
        continue-on-error: true

      - name: Wait before retrying Pages deploy
        if: env.ONBOARDING_READY == 'true' && steps.deployment.outcome == 'failure'
        run: sleep 30

      - id: deployment_retry
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
        if: env.ONBOARDING_READY == 'true' && steps.deployment.outcome == 'failure'
        continue-on-error: true

      - name: Deploy Cloudflare Pages
        if: env.ONBOARDING_READY == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          PROJECT_NAME: torah-pod
        run: |
          for attempt in 1 2 3; do
            if npx --yes wrangler@4.113.0 pages deploy public-dist --project-name "$PROJECT_NAME" --branch main; then
              exit 0
            fi
            echo "::warning::Cloudflare Pages deploy attempt $attempt failed."
            sleep "$((attempt * 20))"
          done
          echo "::error::Cloudflare Pages deploy failed after 3 attempts."
          exit 1

      - name: Mark issue complete
        if: env.ONBOARDING_READY == 'true'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue }}
          ISSUE_REPO: ${{ env.ONBOARDING_ISSUE_REPO }}
          ONBOARDING_PRIVATE_INTAKE: ${{ env.ONBOARDING_PRIVATE_INTAKE }}
          ONBOARDING_INTAKE_TOKEN: ${{ secrets.ONBOARDING_INTAKE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$ONBOARDING_PRIVATE_INTAKE" = "true" ]; then
            issue_token="$ONBOARDING_INTAKE_TOKEN"
          else
            issue_token="$GITHUB_TOKEN"
          fi
          GH_TOKEN="$issue_token" gh issue comment "$ISSUE_NUMBER" --repo "$ISSUE_REPO" --body "Approved and onboarded automatically.

          Feed: $FEED_URL
          Show slug: $SHOW_SLUG"
          GH_TOKEN="$issue_token" gh issue edit "$ISSUE_NUMBER" --repo "$ISSUE_REPO" --remove-label "needs-approval"
          GH_TOKEN="$issue_token" gh issue close "$ISSUE_NUMBER" --repo "$ISSUE_REPO" --reason completed
