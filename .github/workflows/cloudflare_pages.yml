name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - public/**
      - .github/workflows/cloudflare_pages.yml
  workflow_dispatch:
    inputs:
      revision:
        description: "Exact validated main commit to deploy. Leave empty for manual latest-main recovery."
        required: false
        default: ""
      force:
        description: "Redeploy the same live revision for manual recovery."
        required: false
        type: boolean
        default: false
      release_id:
        description: "Retained validated release ID. Empty keeps the existing Git deployment path."
        required: false
        default: ""

permissions:
  contents: read
  actions: write

concurrency:
  group: cloudflare-pages
  queue: max
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
      PROJECT_NAME: torah-pod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0

      - name: Check exact deployment revision
        id: handoff
        env:
          REVISION: ${{ inputs.revision || github.sha }}
          FORCE: ${{ inputs.force }}
          RELEASE_ID: ${{ inputs.release_id }}
          ARTIFACT_MODE: ${{ vars.RELEASE_ARTIFACTS_ENABLED }}
        run: |
          git fetch origin main
          args=()
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          if [ -n "$RELEASE_ID" ]; then args+=(--release-id "$RELEASE_ID"); fi
          if [ "$ARTIFACT_MODE" = "true" ]; then args+=(--artifact-mode); fi
          python -m podcast_feeds.deployment_handoff preflight \
            --revision "$REVISION" --target cloudflare-pages "${args[@]}"

      - name: Fetch and verify retained release
        id: artifact
        if: steps.handoff.outputs.deploy == 'true' && inputs.release_id != ''
        env:
          R2_RELEASE_BUCKET: ${{ vars.R2_RELEASE_BUCKET }}
          R2_RELEASE_ACCOUNT_ID: ${{ secrets.R2_RELEASE_ACCOUNT_ID }}
          R2_RELEASE_ACCESS_KEY: ${{ secrets.R2_RELEASE_READ_ACCESS_KEY }}
          R2_RELEASE_SECRET_KEY: ${{ secrets.R2_RELEASE_READ_SECRET_KEY }}
          RELEASE_ID: ${{ inputs.release_id }}
          REVISION: ${{ inputs.revision || github.sha }}
        run: |
          python -m pip install --requirement requirements.txt
          python -m podcast_feeds.release_pipeline fetch \
            --revision "$REVISION" --release-id "$RELEASE_ID" \
            --bundle-dir release-download --destination public-dist

      - name: Prepare legacy public site
        if: steps.handoff.outputs.deploy == 'true' && inputs.release_id == ''
        run: |
          python scripts/check-public-accounts.py
          cp -R public public-dist

      - name: Add target-specific deployment receipt
        if: steps.handoff.outputs.deploy == 'true'
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          PAYLOAD_DIGEST: ${{ steps.artifact.outputs.payload_digest }}
        run: |
          python scripts/check-public-accounts.py
          args=()
          if [ -n "$RELEASE_ID" ]; then args+=(--release-id "$RELEASE_ID" --payload-digest "$PAYLOAD_DIGEST"); fi
          python -m podcast_feeds.deployment_manifest \
            --target cloudflare-pages \
            --revision "$(git rev-parse HEAD)" \
            --run-id "$GITHUB_RUN_ID" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --output public-dist/deployment.json "${args[@]}"

      - name: Check main again immediately before deployment
        id: latest
        if: steps.handoff.outputs.deploy == 'true'
        env:
          REVISION: ${{ inputs.revision || github.sha }}
          FORCE: ${{ inputs.force }}
          RELEASE_ID: ${{ inputs.release_id }}
          ARTIFACT_MODE: ${{ vars.RELEASE_ARTIFACTS_ENABLED }}
        run: |
          git fetch origin main
          args=()
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          if [ -n "$RELEASE_ID" ]; then args+=(--release-id "$RELEASE_ID"); fi
          if [ "$ARTIFACT_MODE" = "true" ]; then args+=(--artifact-mode); fi
          python -m podcast_feeds.deployment_handoff preflight \
            --revision "$REVISION" --target cloudflare-pages "${args[@]}"

      - name: Deploy public site
        if: steps.handoff.outputs.deploy == 'true' && steps.latest.outputs.deploy == 'true'
        run: |
          for attempt in 1 2 3; do
            if npx --yes wrangler@4.113.0 pages deploy public-dist --project-name "$PROJECT_NAME" --branch main; then
              exit 0
            fi
            echo "::warning::Cloudflare Pages deploy attempt $attempt failed."
            sleep "$((attempt * 20))"
          done
          echo "::error::Cloudflare Pages deploy failed after 3 attempts."
          exit 1

      - name: Verify exact live revision
        if: steps.handoff.outputs.deploy == 'true' && steps.latest.outputs.deploy == 'true'
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          PAYLOAD_DIGEST: ${{ steps.artifact.outputs.payload_digest }}
        run: |
          args=()
          if [ -n "$RELEASE_ID" ]; then args+=(--release-id "$RELEASE_ID" --payload-digest "$PAYLOAD_DIGEST"); fi
          python -m podcast_feeds.deployment_handoff verify \
            --revision "$(git rev-parse HEAD)" --target cloudflare-pages "${args[@]}"

      - name: Hand newer main content to deployment
        if: steps.handoff.outputs.deploy == 'true' && steps.latest.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_MODE: ${{ vars.RELEASE_ARTIFACTS_ENABLED }}
          R2_RELEASE_BUCKET: ${{ vars.R2_RELEASE_BUCKET }}
          R2_RELEASE_ACCOUNT_ID: ${{ secrets.R2_RELEASE_ACCOUNT_ID }}
          R2_RELEASE_ACCESS_KEY: ${{ secrets.R2_RELEASE_READ_ACCESS_KEY }}
          R2_RELEASE_SECRET_KEY: ${{ secrets.R2_RELEASE_READ_SECRET_KEY }}
        run: |
          git fetch origin main
          args=()
          if [ "$ARTIFACT_MODE" = "true" ]; then
            python -m pip install --requirement requirements.txt
            args+=(--artifact-mode)
          fi
          python -m podcast_feeds.deployment_handoff reconcile \
            --revision "$(git rev-parse HEAD)" --target cloudflare-pages --repo "$GITHUB_REPOSITORY" "${args[@]}"
