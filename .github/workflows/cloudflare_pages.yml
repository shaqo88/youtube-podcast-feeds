name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - public/**
      - .github/workflows/cloudflare_pages.yml
  workflow_dispatch:
    inputs:
      revision:
        description: "Exact validated main commit to deploy. Leave empty for manual latest-main recovery."
        required: false
        default: ""
      force:
        description: "Redeploy the same live revision for manual recovery."
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: cloudflare-pages
  queue: max
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
      PROJECT_NAME: torah-pod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0

      - name: Check exact deployment revision
        id: handoff
        env:
          REVISION: ${{ inputs.revision || github.sha }}
          FORCE: ${{ inputs.force }}
        run: |
          git fetch origin main
          args=()
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          python -m podcast_feeds.deployment_handoff preflight \
            --revision "$REVISION" --target cloudflare-pages "${args[@]}"

      - name: Prepare public site
        if: steps.handoff.outputs.deploy == 'true'
        run: |
          python scripts/check-public-accounts.py
          cp -R public public-dist
          python -m podcast_feeds.deployment_manifest \
            --target cloudflare-pages \
            --revision "$(git rev-parse HEAD)" \
            --run-id "$GITHUB_RUN_ID" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --output public-dist/deployment.json

      - name: Check main again immediately before deployment
        id: latest
        if: steps.handoff.outputs.deploy == 'true'
        env:
          REVISION: ${{ inputs.revision || github.sha }}
          FORCE: ${{ inputs.force }}
        run: |
          git fetch origin main
          args=()
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          python -m podcast_feeds.deployment_handoff preflight \
            --revision "$REVISION" --target cloudflare-pages "${args[@]}"

      - name: Deploy public site
        if: steps.handoff.outputs.deploy == 'true' && steps.latest.outputs.deploy == 'true'
        run: |
          for attempt in 1 2 3; do
            if npx --yes wrangler@4.113.0 pages deploy public-dist --project-name "$PROJECT_NAME" --branch main; then
              exit 0
            fi
            echo "::warning::Cloudflare Pages deploy attempt $attempt failed."
            sleep "$((attempt * 20))"
          done
          echo "::error::Cloudflare Pages deploy failed after 3 attempts."
          exit 1

      - name: Verify exact live revision
        if: steps.handoff.outputs.deploy == 'true' && steps.latest.outputs.deploy == 'true'
        run: |
          python -m podcast_feeds.deployment_handoff verify \
            --revision "$(git rev-parse HEAD)" --target cloudflare-pages

      - name: Hand newer main content to deployment
        if: steps.handoff.outputs.deploy == 'true' && steps.latest.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          python -m podcast_feeds.deployment_handoff reconcile \
            --revision "$(git rev-parse HEAD)" --target cloudflare-pages --repo "$GITHUB_REPOSITORY"
