name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - public/**
      - .github/workflows/cloudflare_pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
      PROJECT_NAME: torah-pod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Prepare public site
        run: cp -R public public-dist

      - name: Deploy public site
        run: |
          for attempt in 1 2 3; do
            if npx --yes wrangler@4.113.0 pages deploy public-dist --project-name "$PROJECT_NAME" --branch main; then
              exit 0
            fi
            echo "::warning::Cloudflare Pages deploy attempt $attempt failed."
            sleep "$((attempt * 20))"
          done
          echo "::error::Cloudflare Pages deploy failed after 3 attempts."
          exit 1
