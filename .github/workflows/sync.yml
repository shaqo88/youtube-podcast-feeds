name: Sync Podcast Feeds

env:
  NOTIFICATION_FROM_EMAIL: torahyoupod@gmail.com
  NOTIFICATION_FROM_NAME: Torah Pod

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      show:
        description: "Show slug. Leave empty to sync all enabled shows."
        required: false
        default: ""
      youtube_auth_mode:
        description: "YouTube auth order."
        required: false
        default: "pot_then_cookie"
        type: choice
        options:
          - pot_then_cookie
          - cookie_then_pot
          - pot
          - cookie
          - none
      runner:
        description: "Runner for manual runs. Use a self-hosted YouTube runner to avoid GitHub-hosted/filtered-network blocks."
        required: false
        default: "github-hosted"
        type: choice
        options:
          - github-hosted
          - self-hosted-youtube
          - oracle-youtube
          - google-youtube
          - wsl-youtube

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: repo-writer-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.runner == 'oracle-youtube') && '["self-hosted","oracle-youtube"]' || (github.event_name == 'workflow_dispatch' && inputs.runner == 'google-youtube') && '["self-hosted","google-youtube"]' || (github.event_name == 'workflow_dispatch' && inputs.runner == 'wsl-youtube') && '["self-hosted","wsl-youtube"]' || (github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted-youtube') && '["self-hosted","torah-pod-youtube"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Use self-hosted CA bundle
        if: runner.environment == 'self-hosted'
        run: |
          bundle="$HOME/.netfree-ca-bundle.crt"
          if [ ! -f "$bundle" ]; then
            echo "::notice::No self-hosted CA bundle found at $bundle."
            exit 0
          fi
          {
            echo "SSL_CERT_FILE=$bundle"
            echo "GIT_SSL_CAINFO=$bundle"
            echo "NODE_EXTRA_CA_CERTS=$bundle"
            echo "REQUESTS_CA_BUNDLE=$bundle"
            echo "CURL_CA_BUNDLE=$bundle"
          } >> "$GITHUB_ENV"
          git config --global http.sslCAInfo "$bundle"
          echo "Using self-hosted CA bundle: $bundle"

      - name: Ensure self-hosted swap
        if: runner.environment == 'self-hosted'
        run: |
          if ! sudo -n true 2>/dev/null; then
            echo "::notice::Passwordless sudo is unavailable; skipping self-hosted swap setup."
            free -h
            exit 0
          fi

          if swapon --show=NAME --noheadings | grep -qx '/swapfile'; then
            echo "Swap is already active:"
            swapon --show
            free -h
            exit 0
          fi

          if [ ! -f /swapfile ]; then
            sudo fallocate -l 3G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=3072 status=progress
          fi

          sudo chmod 600 /swapfile
          sudo mkswap -f /swapfile
          sudo swapon /swapfile
          sudo sysctl vm.swappiness=20
          swapon --show
          free -h

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Deno
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg xvfb

      - name: Install Python dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Set WPC browser path
        id: wpc_browser
        run: |
          for candidate in /usr/bin/google-chrome /usr/bin/google-chrome-stable /usr/bin/chromium /usr/bin/chromium-browser; do
            if [ -x "$candidate" ]; then
              echo "path=$candidate" >> "$GITHUB_OUTPUT"
              echo "Using browser for WPC PO-token provider: $candidate"
              exit 0
            fi
          done
          echo "::warning::Chrome/Chromium was not found; WPC PO-token provider will be unavailable."
          echo "path=" >> "$GITHUB_OUTPUT"

      - name: Check mail notification secrets
        id: mail_secrets
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PODCAST_NOTIFY_EMAIL_VAR: ${{ vars.PODCAST_NOTIFY_EMAIL }}
          PODCAST_NOTIFY_EMAIL_SECRET: ${{ secrets.PODCAST_NOTIFY_EMAIL }}
          NOTIFICATION_FROM_EMAIL: ${{ env.NOTIFICATION_FROM_EMAIL }}
        run: |
          if [ -n "$GMAIL_USER" ] && [ -n "$GMAIL_APP_PASSWORD" ] && [ "$GMAIL_USER" = "$NOTIFICATION_FROM_EMAIL" ]; then
            notify_to="${PODCAST_NOTIFY_EMAIL_SECRET:-${PODCAST_NOTIFY_EMAIL_VAR:-$GMAIL_USER}}"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "to=$notify_to" >> "$GITHUB_OUTPUT"
          else
            if [ -n "$GMAIL_USER" ] && [ "$GMAIL_USER" != "$NOTIFICATION_FROM_EMAIL" ]; then
              echo "::warning::GMAIL_USER must be $NOTIFICATION_FROM_EMAIL for Torah Pod notification mail."
            fi
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set sync scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          SHOW: ${{ inputs.show }}
          YOUTUBE_AUTH_MODE: ${{ inputs.youtube_auth_mode }}
        run: |
          auth_mode="${YOUTUBE_AUTH_MODE:-pot_then_cookie}"
          echo "youtube_auth_mode=$auth_mode" >> "$GITHUB_OUTPUT"
          echo "source_args=" >> "$GITHUB_OUTPUT"
          echo "needs_youtube=true" >> "$GITHUB_OUTPUT"
          case "$auth_mode" in
            pot_then_cookie|cookie_then_pot|cookie)
              echo "needs_cookie=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "needs_cookie=false" >> "$GITHUB_OUTPUT"
              ;;
          esac
          case "$auth_mode" in
            pot_then_cookie|cookie_then_pot|pot)
              echo "needs_pot=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "needs_pot=false" >> "$GITHUB_OUTPUT"
              ;;
          esac
          echo "Syncing all configured sources with YouTube auth mode: $auth_mode."

      - name: Start bgutil PO-token provider
        if: steps.scope.outputs.needs_pot == 'true'
        env:
          RUNNER_INPUT: ${{ inputs.runner }}
        run: |
          docker rm -f bgutil-provider >/dev/null 2>&1 || true
          if ! docker run --name bgutil-provider -d --init --network host brainicism/bgutil-ytdlp-pot-provider:1.3.1-deno; then
            echo "::warning::Could not start bgutil provider container; YouTube sync may fall back to cookies."
            if [ "$RUNNER_INPUT" = "oracle-youtube" ]; then
              exit 1
            fi
            exit 0
          fi
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4416/ping >/tmp/bgutil-ping.json; then
              echo "bgutil provider is listening on 127.0.0.1:4416."
              cat /tmp/bgutil-ping.json
              exit 0
            fi
            docker ps --filter name=bgutil-provider --format 'bgutil container: {{.Status}}' || true
            sleep 1
          done
          echo "::warning::bgutil provider did not start listening on 127.0.0.1:4416; YouTube sync may fall back to cookies."
          docker logs bgutil-provider || true
          if [ "$RUNNER_INPUT" = "oracle-youtube" ]; then
            exit 1
          fi

      - name: Write YouTube cookies file
        if: steps.scope.outputs.needs_cookie == 'true'
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          echo "cookie_refresh_required=false" > failure_context.env
          printf '%s' "$YOUTUBE_COOKIES" > /tmp/yt_cookies.txt
          echo "Cookie file: $(wc -l < /tmp/yt_cookies.txt) lines, $(wc -c < /tmp/yt_cookies.txt) bytes"
          echo "YouTube/Google cookie lines: $(grep -Ec '(^|[[:space:]])\.(youtube|google)\.com[[:space:]]|(^|[[:space:]])(youtube|google)\.com[[:space:]]' /tmp/yt_cookies.txt || true)"
          echo "Secure Google session cookie lines: $(grep -Ec '__Secure-[0-9A-Z]*PSID|SAPISID|APISID|SSID|HSID|SID' /tmp/yt_cookies.txt || true)"
          if ! head -n 1 /tmp/yt_cookies.txt | grep -q '^# Netscape HTTP Cookie File'; then
            echo "cookie_refresh_required=true" > failure_context.env
            echo "::error::YOUTUBE_COOKIES is not a Netscape-format cookie file. Refresh it with scripts/set-youtube-cookies.ps1; older filtered secrets may be missing the required Netscape header."
            exit 1
          fi

      - name: Sync episodes
        id: sync
        continue-on-error: true
        timeout-minutes: 20
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHOW: ${{ inputs.show }}
          SOURCE_ARGS: ${{ steps.scope.outputs.source_args }}
          YOUTUBE_AUTH_MODE: ${{ steps.scope.outputs.youtube_auth_mode }}
          YOUTUBE_WPC_BROWSER_PATH: ${{ steps.wpc_browser.outputs.path }}
        run: |
          args=()
          if [ -n "$SHOW" ]; then
            args+=(--show "$SHOW")
          fi
          if [ -n "$SOURCE_ARGS" ]; then
            read -r -a source_args <<< "$SOURCE_ARGS"
            args+=("${source_args[@]}")
          fi
          runner=()
          if [ -n "$YOUTUBE_WPC_BROWSER_PATH" ] && command -v xvfb-run >/dev/null; then
            runner=(xvfb-run -a)
          fi
          "${runner[@]}" python -m podcast_feeds.sync "${args[@]}" --new-episodes-report new-episodes.json --skip-report sync-skips.json 2>&1 | tee sync.log
          exit "${PIPESTATUS[0]}"

      - name: Detect sync changes
        id: sync_changes
        if: always()
        run: |
          if git diff --quiet -- shows; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop failed sync with no changes
        if: steps.sync.outcome != 'success' && steps.sync_changes.outputs.changed != 'true'
        run: |
          echo "::error::Podcast sync failed before changing episode metadata. Skipping build and deploy."
          exit 1

      - name: Build feeds
        if: steps.sync.outcome == 'success' || steps.sync_changes.outputs.changed == 'true'
        env:
          SHOW: ${{ inputs.show }}
        run: |
          if [ -n "$SHOW" ]; then
            python -m podcast_feeds.build --show "$SHOW"
          else
            python -m podcast_feeds.build
          fi

      - name: Validate generated feeds
        if: steps.sync.outcome == 'success' || steps.sync_changes.outputs.changed == 'true'
        env:
          SHOW: ${{ inputs.show }}
        run: |
          if [ -n "$SHOW" ]; then
            python -m podcast_feeds.validate --show "$SHOW"
          else
            python -m podcast_feeds.validate
          fi

      - name: Commit successful sync
        if: steps.sync.outcome == 'success' || steps.sync_changes.outputs.changed == 'true'
        env:
          SHOW: ${{ inputs.show }}
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add shows public
          if git diff --staged --quiet; then
            echo "No sync changes to commit."
            exit 0
          fi
          git commit -m "Sync podcast episodes"

          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi

            echo "::warning::git push failed on attempt $attempt; rebasing generated sync commit on origin/main and retrying."
            git fetch origin main
            git rebase origin/main

            if [ -n "$SHOW" ]; then
              python -m podcast_feeds.build --show "$SHOW"
              python -m podcast_feeds.validate --show "$SHOW"
            else
              python -m podcast_feeds.build
              python -m podcast_feeds.validate
            fi

            git add shows public
            if ! git diff --staged --quiet; then
              git commit --amend --no-edit
            fi
          done

          echo "::error::git push failed after rebasing and retrying."
          exit 1

      - name: Prepare new episode notification
        id: new_episode_email
        if: steps.sync.outcome == 'success' || steps.sync_changes.outputs.changed == 'true'
        env:
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python -m podcast_feeds.episode_notifications from-report \
            --report new-episodes.json \
            --repo "$REPO" \
            --run-url "$RUN_URL" \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Prepare skipped episode notification
        id: skipped_episode_email
        if: steps.sync.outcome == 'success' || steps.sync_changes.outputs.changed == 'true'
        env:
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python -m podcast_feeds.episode_notifications skipped-youtube-from-report \
            --report sync-skips.json \
            --repo "$REPO" \
            --run-url "$RUN_URL" \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Notify on new Torah Pod episodes
        if: steps.new_episode_email.outputs.has_new_episodes == 'true' && steps.mail_secrets.outputs.enabled == 'true'
        continue-on-error: true
        uses: dawidd6/action-send-mail@d38f3f7cd391cdebfe0d38efc3998b935e951c4f  # v16
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: ${{ steps.new_episode_email.outputs.subject }}
          to: ${{ steps.mail_secrets.outputs.to }}
          from: ${{ env.NOTIFICATION_FROM_NAME }} <${{ env.NOTIFICATION_FROM_EMAIL }}>
          body: ${{ steps.new_episode_email.outputs.body }}

      - name: Notify on skipped YouTube episodes
        if: steps.skipped_episode_email.outputs.has_actionable_skips == 'true' && steps.mail_secrets.outputs.enabled == 'true'
        continue-on-error: true
        uses: dawidd6/action-send-mail@d38f3f7cd391cdebfe0d38efc3998b935e951c4f  # v16
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: ${{ steps.skipped_episode_email.outputs.subject }}
          to: ${{ steps.mail_secrets.outputs.to }}
          from: ${{ env.NOTIFICATION_FROM_NAME }} <${{ env.NOTIFICATION_FROM_EMAIL }}>
          body: ${{ steps.skipped_episode_email.outputs.body }}

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
        if: steps.sync.outcome == 'success' || steps.sync_changes.outputs.changed == 'true'

      - name: Prepare public site
        if: steps.sync.outcome == 'success' || steps.sync_changes.outputs.changed == 'true'
        run: cp -R public public-dist

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        if: steps.sync.outcome == 'success' || steps.sync_changes.outputs.changed == 'true'
        with:
          path: public-dist

      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
        if: steps.sync.outcome == 'success' || steps.sync_changes.outputs.changed == 'true'
        continue-on-error: true

      - name: Wait before retrying Pages deploy
        if: (steps.sync.outcome == 'success' || steps.sync_changes.outputs.changed == 'true') && steps.deployment.outcome == 'failure'
        run: sleep 30

      - id: deployment_retry
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
        if: (steps.sync.outcome == 'success' || steps.sync_changes.outputs.changed == 'true') && steps.deployment.outcome == 'failure'

      - name: Deploy Cloudflare Pages
        if: runner.environment != 'self-hosted' && (steps.sync.outcome == 'success' || steps.sync_changes.outputs.changed == 'true')
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          PROJECT_NAME: torah-pod
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Cloudflare Pages secrets are not configured; skipping Cloudflare deploy."
            exit 0
          fi

          for attempt in 1 2 3; do
            if npx wrangler@4 pages deploy public-dist --project-name "$PROJECT_NAME" --branch main; then
              exit 0
            fi
            echo "::warning::Cloudflare Pages deploy attempt $attempt failed."
            sleep "$((attempt * 20))"
          done
          echo "::error::Cloudflare Pages deploy failed after 3 attempts."
          exit 1

      - name: Report partial sync failure
        if: always() && steps.sync.outcome != 'success' && steps.sync_changes.outputs.changed == 'true'
        run: |
          echo "One or more episodes failed. Successful episodes were preserved."
          exit 1

      - name: Prepare failure notification
        id: failure_email
        if: failure() && steps.mail_secrets.outputs.enabled == 'true'
        env:
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHOW: ${{ inputs.show }}
          AUTH_MODE: ${{ steps.scope.outputs.youtube_auth_mode }}
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
        run: |
          cookie_refresh_required=false
          if [ -f failure_context.env ]; then
            . ./failure_context.env
          fi
          youtube_auth_blocked=false
          if [ "$SYNC_OUTCOME" != "success" ] && [ -f sync.log ] && grep -Eiq 'YouTube auth/bot-check block|sign in to confirm.*not.*bot|not a bot|HTTP Error 403: Forbidden' sync.log; then
            youtube_auth_blocked=true
          fi

          show_arg=""
          script_show_arg=""
          if [ -n "$SHOW" ]; then
            show_arg=" -f show=$SHOW"
            script_show_arg=" -Show $SHOW"
          fi

          if [ "$cookie_refresh_required" = "true" ]; then
            subject="Torah Pod YouTube cookie refresh needed"
          elif [ "$youtube_auth_blocked" = "true" ]; then
            subject="Torah Pod YouTube sync blocked by runner"
          else
            subject="Torah Pod podcast sync failed"
          fi
          echo "subject=$subject" >> "$GITHUB_OUTPUT"

          {
            echo "Torah Pod sync failed."
            echo
            echo "Run: $RUN_URL"
            echo "Repository: $REPO"
            echo "Show input: ${SHOW:-all enabled shows}"
            echo "YouTube auth mode: ${AUTH_MODE:-pot_then_cookie}"
            echo "Cookie refresh likely required: $cookie_refresh_required"
            echo "YouTube runner/auth block seen: $youtube_auth_blocked"
            echo
            if [ "$cookie_refresh_required" = "true" ]; then
              echo "Action required: refresh the GitHub Actions YOUTUBE_COOKIES secret, then rerun sync."
              echo
              echo "1. Export fresh YouTube cookies in Netscape format from a logged-in browser profile."
              echo "   The file must start with: # Netscape HTTP Cookie File"
              echo
              echo "2. Open PowerShell and run:"
              echo
              echo '   cd C:\Users\ShaulRoyzen\Documents\personal\repos\youtube-podcast-feeds'
              echo '   $env:GH_CONFIG_DIR = "$env:LOCALAPPDATA\gh-codex-shaqo88"'
              echo "   .\\scripts\\set-youtube-cookies.ps1 -CookieFile \"C:\\Users\\ShaulRoyzen\\Downloads\\cookies.txt\" -YouTubeAuthMode cookie_then_pot$script_show_arg -RunSync"
              echo
              echo "   If the exported file has a different name, replace the CookieFile path."
              echo
              echo "3. Optional manual rerun after the secret is renewed:"
              echo
              echo "   gh workflow run sync.yml --repo $REPO -f youtube_auth_mode=cookie_then_pot$show_arg"
              echo
              echo "4. Watch the rerun:"
              echo
              echo "   gh run watch --repo $REPO --exit-status"
              echo
              echo "Reply note for yourself: after you run the command above, the workflow has already been re-triggered when -RunSync is used."
            elif [ "$youtube_auth_blocked" = "true" ]; then
              echo "This looks like a YouTube runner/bot-check block, not proof that the cookie secret is stale."
              echo "The scheduled workflow will retry automatically on GitHub-hosted runners."
              echo "If an episode is urgent, start the torah-pod-youtube self-hosted runner and rerun:"
              echo
              echo "   gh workflow run sync.yml --repo $REPO -f runner=self-hosted-youtube -f youtube_auth_mode=pot_then_cookie$show_arg"
            else
              echo "This failure was not classified as a YouTube cookie failure."
              echo "Open the run logs and triage R2, Drive, Pages deploy, or source-specific errors."
            fi
            echo
            echo "Recent sync log tail:"
            echo "---------------------"
            if [ -f sync.log ]; then
              tail -n 80 sync.log
            else
              echo "No sync.log was created. The failure likely happened before the sync step."
            fi
          } > failure-email.txt
          cat failure-email.txt >> "$GITHUB_STEP_SUMMARY"
          delimiter="EMAIL_BODY_$(date +%s%N)"
          {
            echo "body<<$delimiter"
            cat failure-email.txt
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Notify on failure
        if: failure() && steps.mail_secrets.outputs.enabled == 'true'
        uses: dawidd6/action-send-mail@d38f3f7cd391cdebfe0d38efc3998b935e951c4f  # v16
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ env.GMAIL_USER }}
          password: ${{ env.GMAIL_APP_PASSWORD }}
          subject: ${{ steps.failure_email.outputs.subject }}
          to: ${{ steps.mail_secrets.outputs.to }}
          from: ${{ env.NOTIFICATION_FROM_NAME }} <${{ env.NOTIFICATION_FROM_EMAIL }}>
          body: ${{ steps.failure_email.outputs.body }}
