name: Credential Health Check

on:
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Cloudflare API tokens without logging them
        env:
          CLOUDFLARE_WORKER_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
        run: |
          verify_token() {
            token_name="$1"
            token_value="$2"
            if [ -z "$token_value" ]; then
              printf '{"configured":false}' > "$token_name.json"
              return 0
            fi
            curl --silent --show-error --max-time 20 \
              --header "Authorization: Bearer $token_value" \
              --header 'Content-Type: application/json' \
              'https://api.cloudflare.com/client/v4/user/tokens/verify' \
              > "$token_name.json" || printf '{"success":false,"errors":[{"message":"verification request failed"}]}' > "$token_name.json"
          }
          verify_token cloudflare-worker "$CLOUDFLARE_WORKER_TOKEN"
          verify_token cloudflare-pages "$CLOUDFLARE_PAGES_TOKEN"

      - name: Inspect Google service-account key metadata
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            printf '{"configured":false}' > google-service-account.json
          else
            printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" | python -c 'import json, sys; raw=json.load(sys.stdin); print(json.dumps({"configured": True, "client_email": raw.get("client_email"), "private_key_id": raw.get("private_key_id"), "type": raw.get("type")}))' > google-service-account.json
          fi

      - name: Verify private-intake GitHub token without logging it
        env:
          ONBOARDING_INTAKE_TOKEN: ${{ secrets.ONBOARDING_INTAKE_TOKEN }}
          INTAKE_REPOSITORY: shaqo88/torah-pod-intake
        run: |
          if [ -z "$ONBOARDING_INTAKE_TOKEN" ]; then
            printf '{"configured":false}' > github-onboarding.json
            exit 0
          fi
          status="$(curl --silent --show-error --max-time 20 \
            --request GET \
            --header "Authorization: Bearer $ONBOARDING_INTAKE_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --dump-header github-onboarding.headers \
            --output /dev/null \
            --write-out '%{http_code}' \
            "https://api.github.com/repos/$INTAKE_REPOSITORY" || true)"
          export GITHUB_ONBOARDING_STATUS="$status"
          python -c 'import json, os; from pathlib import Path; headers=Path("github-onboarding.headers").read_text(encoding="utf-8", errors="replace") if Path("github-onboarding.headers").exists() else ""; expiry=next((line.split(":", 1)[1].strip() for line in headers.splitlines() if line.lower().startswith("github-authentication-token-expiration:")), None); print(json.dumps({"configured": True, "verified": os.environ.get("GITHUB_ONBOARDING_STATUS") == "200", "expires_on": expiry}))' > github-onboarding.json
          rm -f github-onboarding.headers

      - name: Build credential health report
        env:
          CREDENTIAL_ROTATION_SCHEDULE: ${{ vars.CREDENTIAL_ROTATION_SCHEDULE }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import date, datetime
          from pathlib import Path

          today = date.today()
          messages = []
          failures = []

          def load(path):
              try:
                  return json.loads(Path(path).read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError) as exc:
                  failures.append(f"Could not read {path}: {exc}")
                  return {}

          schedule_text = os.environ.get("CREDENTIAL_ROTATION_SCHEDULE", "").strip()
          if not schedule_text:
              messages.append("Rotation schedule is not configured. Add the CREDENTIAL_ROTATION_SCHEDULE repository variable to enable expiry reminders.")
              schedule = []
          else:
              try:
                  parsed = json.loads(schedule_text)
                  schedule = parsed.get("items", []) if isinstance(parsed, dict) else parsed
                  if not isinstance(schedule, list):
                      raise ValueError("must be a JSON list or an object with an items list")
              except (json.JSONDecodeError, ValueError) as exc:
                  failures.append(f"CREDENTIAL_ROTATION_SCHEDULE is invalid: {exc}")
                  schedule = []

          rows = []
          for item in schedule:
              name = str(item.get("name", "")).strip()
              due_text = str(item.get("rotate_by", "")).strip()
              if not name or not due_text:
                  failures.append("Every rotation entry needs name and rotate_by (YYYY-MM-DD).")
                  continue
              try:
                  due = datetime.strptime(due_text, "%Y-%m-%d").date()
              except ValueError:
                  failures.append(f"{name}: rotate_by must use YYYY-MM-DD.")
                  continue
              days = (due - today).days
              if days < 0:
                  state = "overdue"
                  failures.append(f"{name}: rotation is overdue by {-days} day(s).")
              elif days <= 30:
                  state = "due soon"
                  messages.append(f"{name}: rotate within {days} day(s).")
              else:
                  state = "scheduled"
              rows.append((name, due.isoformat(), days, state))

          for label, path in (("Cloudflare Worker", "cloudflare-worker.json"), ("Cloudflare Pages", "cloudflare-pages.json")):
              result = load(path)
              if not result.get("configured") and "configured" in result:
                  messages.append(f"{label} API token is not configured for this check.")
                  continue
              token = result.get("result") or {}
              if result.get("success") is not True:
                  failures.append(f"{label} API token verification failed.")
                  continue
              expiry = token.get("expires_on") or "no expiry reported"
              messages.append(f"{label} API token verified; expiry: {expiry}.")

          google = load("google-service-account.json")
          if google.get("configured"):
              messages.append("Google service-account key is configured; Google does not provide an automatic expiry in this credential, so rotate it on the configured schedule.")
          else:
              messages.append("Google service-account key is not configured for this check.")

          github = load("github-onboarding.json")
          if not github.get("configured"):
              failures.append("GitHub onboarding token is not configured.")
          elif not github.get("verified"):
              failures.append("GitHub onboarding token cannot read the private intake repository.")
          else:
              expiry = github.get("expires_on") or "no expiry reported; use the rotation schedule"
              messages.append(f"GitHub onboarding token verified against the private intake repository; expiry: {expiry}.")

          lines = ["# Torah Pod Credential Health Report", "", f"Checked: {today.isoformat()}", ""]
          if rows:
              lines += ["## Rotation Schedule", "", "| Credential | Rotate by | Days | Status |", "| --- | --- | ---: | --- |"]
              lines += [f"| {name} | {due} | {days} | {state} |" for name, due, days, state in rows]
          else:
              lines += ["## Rotation Schedule", "", "No schedule entries configured."]
          lines += ["", "## Checks", ""]
          lines += [f"- {message}" for message in messages] or ["- No checks completed."]
          if failures:
              lines += ["", "## Action Required", ""] + [f"- {failure}" for failure in failures]
          Path("credential-health.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          Path("credential-health.html").write_text(
              "<html><body><pre>" + __import__("html").escape("\n".join(lines)) + "</pre></body></html>", encoding="utf-8"
          )
          Path("credential-status.txt").write_text("failed" if failures else "ok", encoding="utf-8")
          PY
          cat credential-health.md >> "$GITHUB_STEP_SUMMARY"

      - name: Send credential health report
        if: always()
        continue-on-error: true
        uses: dawidd6/action-send-mail@d38f3f7cd391cdebfe0d38efc3998b935e951c4f  # v16
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: Torah Pod credential health report
          to: ${{ secrets.PODCAST_NOTIFY_EMAIL || vars.PODCAST_NOTIFY_EMAIL || secrets.GMAIL_USER }}
          from: Torah Pod <${{ secrets.GMAIL_USER }}>
          body: file://credential-health.md
          html_body: file://credential-health.html

      - name: Fail when a credential needs immediate action
        run: test "$(cat credential-status.txt)" = ok
