name: Rebuild Feeds

on:
  workflow_dispatch:
    inputs:
      show:
        description: "Show slug. Leave empty to rebuild all enabled shows."
        required: false
        default: ""

permissions:
  actions: write
  contents: write

concurrency:
  group: repo-writer-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Capture linked-feed inputs for retained release
        if: vars.RELEASE_ARTIFACTS_ENABLED == 'true'
        run: python -m podcast_feeds.linked_feed_refresh

      - name: Record release render instant
        if: vars.RELEASE_ARTIFACTS_ENABLED == 'true'
        run: echo "TORAH_POD_BUILD_INSTANT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Build feeds
        env:
          SHOW: ${{ inputs.show }}
          TORAH_POD_RELEASE_RENDER: ${{ vars.RELEASE_ARTIFACTS_ENABLED == 'true' && '1' || '' }}
        run: |
          if [ -n "$SHOW" ]; then
            python -m podcast_feeds.build --show "$SHOW"
          else
            python -m podcast_feeds.build
          fi

      - name: Validate generated feeds
        env:
          SHOW: ${{ inputs.show }}
        run: |
          if [ -n "$SHOW" ]; then
            python -m podcast_feeds.validate --show "$SHOW"
          else
            python -m podcast_feeds.validate
          fi

      - name: Commit rebuilt feeds
        id: commit
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add public
          if git diff --staged --quiet; then
            echo 'No public changes to publish.'
            exit 0
          fi
          git commit -m "Rebuild podcast feeds"
          git push
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Retain validated release
        id: release
        if: steps.commit.outputs.changed == 'true' && vars.RELEASE_ARTIFACTS_ENABLED == 'true'
        env:
          R2_RELEASE_BUCKET: ${{ vars.R2_RELEASE_BUCKET }}
          R2_RELEASE_ACCOUNT_ID: ${{ secrets.R2_RELEASE_ACCOUNT_ID }}
          R2_RELEASE_ACCESS_KEY: ${{ secrets.R2_RELEASE_WRITE_ACCESS_KEY }}
          R2_RELEASE_SECRET_KEY: ${{ secrets.R2_RELEASE_WRITE_SECRET_KEY }}
        run: |
          git fetch origin main
          python -m podcast_feeds.release_pipeline prepare \
            --revision "$(git rev-parse HEAD)" --output release-bundle

      - name: Hand validated content to deployment
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          git fetch origin main
          args=()
          if [ -n "$RELEASE_ID" ]; then args+=(--release-id "$RELEASE_ID"); fi
          python -m podcast_feeds.deployment_handoff dispatch \
            --revision "$(git rev-parse HEAD)" --repo "$GITHUB_REPOSITORY" "${args[@]}"
