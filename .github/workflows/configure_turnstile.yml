name: Configure Onboarding Turnstile

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Create Turnstile widget and set Worker secret
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          headers=(--header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" --header "Content-Type: application/json")
          widgets=$(curl --fail-with-body "${headers[@]}" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/challenges/widgets")
          sitekey=$(jq -r '.result[] | select(.name == "Torah Pod onboarding") | .sitekey' <<<"$widgets" | head -n 1)
          if [ -z "$sitekey" ]; then
            response=$(curl --fail-with-body --request POST "${headers[@]}" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/challenges/widgets" \
              --data '{"name":"Torah Pod onboarding","domains":["torah-pod.pages.dev","shaqo88.github.io"],"mode":"managed"}')
            sitekey=$(jq -r '.result.sitekey // empty' <<<"$response")
            secret=$(jq -r '.result.secret // empty' <<<"$response")
          else
            response=$(curl --fail-with-body --request POST "${headers[@]}" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/challenges/widgets/$sitekey/rotate_secret")
            secret=$(jq -r '.result.secret // empty' <<<"$response")
          fi
          test -n "$sitekey" && test -n "$secret"
          echo "::add-mask::$secret"
          printf '%s' "$secret" | npx wrangler@4 secret put TURNSTILE_SECRET --config workers/onboarding/wrangler.toml
          echo "Turnstile site key: $sitekey"
