name: Notify New Episodes

env:
  NOTIFICATION_FROM_EMAIL: torahyoupod@gmail.com
  NOTIFICATION_FROM_NAME: Torah Pod

on:
  push:
    branches:
      - main
    paths:
      - 'shows/**/episodes.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Detect new Torah Pod episodes
        id: episode_email
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          before="$BEFORE"
          after="$AFTER"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            before="$(git rev-parse HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)"
          elif [ -z "$before" ] || [[ "$before" =~ ^0+$ ]]; then
            before="$(git rev-list --max-parents=0 "$after")"
          fi
          python -m podcast_feeds.episode_notifications from-git-diff \
            --before "$before" \
            --after "$after" \
            --repo "$REPO" \
            --run-url "$RUN_URL" \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Check mail notification secrets
        id: mail
        if: steps.episode_email.outputs.has_new_episodes == 'true'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PODCAST_NOTIFY_EMAIL_VAR: ${{ vars.PODCAST_NOTIFY_EMAIL }}
          PODCAST_NOTIFY_EMAIL_SECRET: ${{ secrets.PODCAST_NOTIFY_EMAIL }}
          NOTIFICATION_FROM_EMAIL: ${{ env.NOTIFICATION_FROM_EMAIL }}
        run: |
          if [ -n "$GMAIL_USER" ] && [ -n "$GMAIL_APP_PASSWORD" ] && [ "$GMAIL_USER" = "$NOTIFICATION_FROM_EMAIL" ]; then
            notify_to="${PODCAST_NOTIFY_EMAIL_SECRET:-${PODCAST_NOTIFY_EMAIL_VAR:-$GMAIL_USER}}"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "to=$notify_to" >> "$GITHUB_OUTPUT"
          else
            if [ -n "$GMAIL_USER" ] && [ "$GMAIL_USER" != "$NOTIFICATION_FROM_EMAIL" ]; then
              echo "::warning::GMAIL_USER must be $NOTIFICATION_FROM_EMAIL for Torah Pod notification mail."
            fi
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::error::New episodes were detected, but notification email is not configured correctly."
            exit 1
          fi

      - name: Send email notification
        if: steps.episode_email.outputs.has_new_episodes == 'true' && steps.mail.outputs.enabled == 'true'
        uses: dawidd6/action-send-mail@94de994a9f6fffee200243214e17002e2920bb59  # v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: ${{ steps.episode_email.outputs.subject }}
          to: ${{ steps.mail.outputs.to }}
          from: ${{ env.NOTIFICATION_FROM_NAME }} <${{ env.NOTIFICATION_FROM_EMAIL }}>
          body: ${{ steps.episode_email.outputs.body }}
