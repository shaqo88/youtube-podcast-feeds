name: Migrate Existing Media To R2 Prefix

on:
  workflow_dispatch:
    inputs:
      show:
        description: "Show slug to migrate, for example nachmanson."
        required: true
      dry_run:
        description: "Print planned copies without uploading."
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  actions: write
  contents: write

concurrency:
  group: repo-writer-main
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Migrate media
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m podcast_feeds.migrate_media --show "${{ inputs.show }}" --dry-run
          else
            python -m podcast_feeds.migrate_media --show "${{ inputs.show }}"
          fi

      - name: Capture linked-feed inputs for retained release
        if: inputs.dry_run == 'false' && vars.RELEASE_ARTIFACTS_ENABLED == 'true'
        run: python -m podcast_feeds.linked_feed_refresh

      - name: Record release render instant
        if: inputs.dry_run == 'false' && vars.RELEASE_ARTIFACTS_ENABLED == 'true'
        run: echo "TORAH_POD_BUILD_INSTANT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Build feed
        if: inputs.dry_run == 'false'
        env:
          TORAH_POD_RELEASE_RENDER: ${{ vars.RELEASE_ARTIFACTS_ENABLED == 'true' && '1' || '' }}
        run: python -m podcast_feeds.build --show "${{ inputs.show }}"

      - name: Validate feed
        if: inputs.dry_run == 'false'
        run: python -m podcast_feeds.validate --show "${{ inputs.show }}"

      - name: Commit migrated media records
        if: inputs.dry_run == 'false'
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          if [ "${{ vars.RELEASE_ARTIFACTS_ENABLED }}" = "true" ]; then
            git add "shows/${{ inputs.show }}" public
          else
            git add "shows/${{ inputs.show }}" "public/${{ inputs.show }}"
          fi
          git diff --staged --quiet || git commit -m "Migrate ${{ inputs.show }} media to standard R2 prefix"
          git push

      - name: Retain validated release
        id: release
        if: inputs.dry_run == 'false' && vars.RELEASE_ARTIFACTS_ENABLED == 'true'
        env:
          R2_RELEASE_BUCKET: ${{ vars.R2_RELEASE_BUCKET }}
          R2_RELEASE_ACCOUNT_ID: ${{ secrets.R2_RELEASE_ACCOUNT_ID }}
          R2_RELEASE_ACCESS_KEY: ${{ secrets.R2_RELEASE_WRITE_ACCESS_KEY }}
          R2_RELEASE_SECRET_KEY: ${{ secrets.R2_RELEASE_WRITE_SECRET_KEY }}
        run: |
          git fetch origin main
          python -m podcast_feeds.release_pipeline prepare \
            --revision "$(git rev-parse HEAD)" --output release-bundle

      - name: Hand validated content to deployment
        if: inputs.dry_run == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          git fetch origin main
          args=()
          if [ -n "$RELEASE_ID" ]; then args+=(--release-id "$RELEASE_ID"); fi
          python -m podcast_feeds.deployment_handoff dispatch \
            --revision "$(git rev-parse HEAD)" --repo "$GITHUB_REPOSITORY" "${args[@]}"
