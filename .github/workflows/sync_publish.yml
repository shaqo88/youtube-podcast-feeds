name: Publish Sync Candidates

env:
  NOTIFICATION_FROM_EMAIL: torahyoupod@gmail.com
  NOTIFICATION_FROM_NAME: Torah Pod

on:
  schedule:
    - cron: '53 * * * *'
  workflow_run:
    workflows: [Sync YouTube Worker, Sync Drive Worker, Sync Existing Feed Worker]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: repo-writer-main
  cancel-in-progress: false

jobs:
  publish:
    if: vars.R2_STATE_BUCKET != ''
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONUNBUFFERED: "1"
      GH_TOKEN: ${{ github.token }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
      R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
      R2_STATE_ACCOUNT_ID: ${{ secrets.R2_STATE_ACCOUNT_ID }}
      R2_STATE_ACCESS_KEY: ${{ secrets.R2_STATE_ACCESS_KEY }}
      R2_STATE_SECRET_KEY: ${{ secrets.R2_STATE_SECRET_KEY }}
      R2_STATE_BUCKET: ${{ vars.R2_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install publisher dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Apply outstanding candidates
        id: candidates
        run: |
          python -m podcast_feeds.sync_state apply --manifest applied-candidates.json
          count="$(python -c 'import json; print(len(json.load(open("applied-candidates.json", encoding="utf-8"))))')"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Capture linked-feed inputs for retained release
        if: steps.candidates.outputs.count != '0' && vars.RELEASE_ARTIFACTS_ENABLED == 'true'
        run: python -m podcast_feeds.linked_feed_refresh

      - name: Record release render instant
        if: steps.candidates.outputs.count != '0' && vars.RELEASE_ARTIFACTS_ENABLED == 'true'
        run: echo "TORAH_POD_BUILD_INSTANT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Build and validate feeds
        if: steps.candidates.outputs.count != '0'
        env:
          TORAH_POD_RELEASE_RENDER: ${{ vars.RELEASE_ARTIFACTS_ENABLED == 'true' && '1' || '' }}
        run: |
          python -m podcast_feeds.build
          python -m podcast_feeds.validate

      - name: Commit candidates
        id: commit
        if: steps.candidates.outputs.count != '0'
        run: |
          before="$(git rev-parse HEAD)"
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add shows public
          git diff --staged --quiet || git commit -m "Publish synchronized podcast episodes"
          git push
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Checkpoint publication receipts
        if: steps.candidates.outputs.count != '0'
        run: python -m podcast_feeds.sync_state receipt --manifest applied-candidates.json --revision "${{ steps.commit.outputs.revision }}"

      - name: Retain validated release
        id: release
        if: steps.commit.outputs.revision != '' && vars.RELEASE_ARTIFACTS_ENABLED == 'true'
        env:
          R2_RELEASE_BUCKET: ${{ vars.R2_RELEASE_BUCKET }}
          R2_RELEASE_ACCOUNT_ID: ${{ secrets.R2_RELEASE_ACCOUNT_ID }}
          R2_RELEASE_ACCESS_KEY: ${{ secrets.R2_RELEASE_ACCESS_KEY }}
          R2_RELEASE_SECRET_KEY: ${{ secrets.R2_RELEASE_SECRET_KEY }}
        run: |
          git fetch origin main
          python -m podcast_feeds.release_pipeline prepare \
            --revision "${{ steps.commit.outputs.revision }}" --output release-bundle

      - name: Dispatch primary deployment
        id: dispatch_primary
        if: steps.commit.outputs.revision != '' && (vars.RELEASE_ARTIFACTS_ENABLED != 'true' || steps.release.outcome == 'success')
        continue-on-error: true
        env:
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          PAYLOAD_DIGEST: ${{ steps.release.outputs.payload_digest }}
        run: |
          args=()
          receipt_args=()
          if [ -n "$RELEASE_ID" ]; then
            args+=(-f "release_id=$RELEASE_ID")
            receipt_args+=(--release-id "$RELEASE_ID" --payload-digest "$PAYLOAD_DIGEST")
          fi
          gh workflow run cloudflare_pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f "revision=${{ steps.commit.outputs.revision }}" "${args[@]}"
          python -m podcast_feeds.sync_state update-receipts --manifest applied-candidates.json --deployment cloudflare-pages --status dispatched "${receipt_args[@]}"

      - name: Dispatch mirror deployment
        id: dispatch_mirror
        if: steps.commit.outputs.revision != '' && (vars.RELEASE_ARTIFACTS_ENABLED != 'true' || steps.release.outcome == 'success')
        continue-on-error: true
        env:
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          PAYLOAD_DIGEST: ${{ steps.release.outputs.payload_digest }}
        run: |
          args=()
          receipt_args=()
          if [ -n "$RELEASE_ID" ]; then
            args+=(-f "release_id=$RELEASE_ID")
            receipt_args+=(--release-id "$RELEASE_ID" --payload-digest "$PAYLOAD_DIGEST")
          fi
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f "revision=${{ steps.commit.outputs.revision }}" "${args[@]}"
          python -m podcast_feeds.sync_state update-receipts --manifest applied-candidates.json --deployment github-pages --status dispatched "${receipt_args[@]}"

      - name: Verify primary production feed
        id: verify_primary
        if: steps.commit.outputs.revision != ''
        continue-on-error: true
        env:
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          PAYLOAD_DIGEST: ${{ steps.release.outputs.payload_digest }}
        run: |
          args=()
          if [ -n "$RELEASE_ID" ]; then args+=(--release-id "$RELEASE_ID" --payload-digest "$PAYLOAD_DIGEST"); fi
          python -m podcast_feeds.publication_verify --target cloudflare-pages --revision "${{ steps.commit.outputs.revision }}" --manifest applied-candidates.json "${args[@]}"

      - name: Verify mirror deployment
        id: verify_mirror
        if: steps.commit.outputs.revision != ''
        continue-on-error: true
        env:
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          PAYLOAD_DIGEST: ${{ steps.release.outputs.payload_digest }}
        run: |
          args=()
          if [ -n "$RELEASE_ID" ]; then args+=(--release-id "$RELEASE_ID" --payload-digest "$PAYLOAD_DIGEST"); fi
          python -m podcast_feeds.publication_verify --target github-pages --revision "${{ steps.commit.outputs.revision }}" --manifest applied-candidates.json "${args[@]}"

      - name: Record primary deployment outcome
        if: always() && steps.commit.outputs.revision != ''
        env:
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          PAYLOAD_DIGEST: ${{ steps.release.outputs.payload_digest }}
        run: |
          status=failed
          [ "${{ steps.verify_primary.outcome }}" = success ] && status=verified
          args=()
          if [ -n "$RELEASE_ID" ]; then args+=(--release-id "$RELEASE_ID" --payload-digest "$PAYLOAD_DIGEST"); fi
          python -m podcast_feeds.sync_state update-receipts --manifest applied-candidates.json --deployment cloudflare-pages --status "$status" "${args[@]}"

      - name: Record mirror deployment outcome
        if: always() && steps.commit.outputs.revision != ''
        env:
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          PAYLOAD_DIGEST: ${{ steps.release.outputs.payload_digest }}
        run: |
          status=failed
          [ "${{ steps.verify_mirror.outcome }}" = success ] && status=verified
          args=()
          if [ -n "$RELEASE_ID" ]; then args+=(--release-id "$RELEASE_ID" --payload-digest "$PAYLOAD_DIGEST"); fi
          python -m podcast_feeds.sync_state update-receipts --manifest applied-candidates.json --deployment github-pages --status "$status" "${args[@]}"

      - name: Prepare new episode notification
        id: notification
        if: steps.verify_primary.outcome == 'success' && steps.verify_mirror.outcome == 'success'
        run: |
          python -m podcast_feeds.sync_state notifications --manifest applied-candidates.json --output pending-notifications.json
          python -m podcast_feeds.episode_notifications from-report \
            --report pending-notifications.json \
            --repo "$GITHUB_REPOSITORY" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Send verified episode notification
        if: steps.notification.outputs.has_new_episodes == 'true'
        id: send_notification
        uses: dawidd6/action-send-mail@94de994a9f6fffee200243214e17002e2920bb59  # v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: ${{ steps.notification.outputs.subject }}
          to: ${{ secrets.PODCAST_NOTIFY_EMAIL || secrets.GMAIL_USER }}
          from: ${{ env.NOTIFICATION_FROM_NAME }} <${{ env.NOTIFICATION_FROM_EMAIL }}>
          body: ${{ steps.notification.outputs.body }}

      - name: Record notification delivery
        if: steps.notification.outputs.has_new_episodes == 'true' && steps.send_notification.outcome == 'success'
        run: python -m podcast_feeds.sync_state update-receipts --manifest applied-candidates.json --notification sent

      - name: Record failed notification delivery
        if: always() && steps.notification.outputs.has_new_episodes == 'true' && steps.send_notification.outcome == 'failure'
        run: python -m podcast_feeds.sync_state update-receipts --manifest applied-candidates.json --notification failed

      - name: Record that no notification was required
        if: steps.verify_primary.outcome == 'success' && steps.verify_mirror.outcome == 'success' && steps.notification.outcome == 'success' && steps.notification.outputs.has_new_episodes != 'true'
        run: python -m podcast_feeds.sync_state update-receipts --manifest applied-candidates.json --notification not_required

      - name: Fail incomplete production verification
        if: always() && steps.commit.outputs.revision != '' && (steps.verify_primary.outcome != 'success' || steps.verify_mirror.outcome != 'success')
        run: |
          exit 1
