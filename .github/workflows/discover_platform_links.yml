name: Discover Platform Links

on:
  schedule:
    - cron: '43 5 * * 0'
  workflow_dispatch:
    inputs:
      show:
        description: "Show slug. Leave empty to scan all enabled shows."
        required: false
        default: ""

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: repo-writer-main
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Discover verified platform links
        env:
          SHOW: ${{ inputs.show }}
          PODCASTINDEX_API_KEY: ${{ secrets.PODCASTINDEX_API_KEY }}
          PODCASTINDEX_API_SECRET: ${{ secrets.PODCASTINDEX_API_SECRET }}
        run: |
          if [ -n "$SHOW" ]; then
            python -m podcast_feeds.discover_platform_links --show "$SHOW" --write --report platform-link-report.md
          else
            python -m podcast_feeds.discover_platform_links --write --report platform-link-report.md
          fi
          cat platform-link-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Check for manual review candidates
        id: candidates
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path

          report = Path("platform-link-report.md").read_text(encoding="utf-8")
          manual = report.split("## Manual review candidates", 1)[1].split("## Discovery errors", 1)[0]
          print(f"present={'false' if '- None' in manual else 'true'}")
          PY

      - name: Create or update manual review issue
        if: steps.candidates.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Platform link candidates"
          body_file="$(mktemp)"
          {
            echo "The platform-link discovery job found title-based candidates that were not auto-added."
            echo
            echo "Only exact RSS feed matches are written automatically. Review these manually before adding any link to \`podcast.platforms\`."
            echo
            cat platform-link-report.md
          } > "$body_file"
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)"
          if [ -n "$number" ]; then
            gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file "$body_file"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$body_file"
          fi

      - name: Capture linked-feed inputs for retained release
        if: vars.RELEASE_ARTIFACTS_ENABLED == 'true'
        run: python -m podcast_feeds.linked_feed_refresh

      - name: Record release render instant
        if: vars.RELEASE_ARTIFACTS_ENABLED == 'true'
        run: echo "TORAH_POD_BUILD_INSTANT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Build feeds and portal
        env:
          TORAH_POD_RELEASE_RENDER: ${{ vars.RELEASE_ARTIFACTS_ENABLED == 'true' && '1' || '' }}
        run: python -m podcast_feeds.build

      - name: Validate generated feeds
        run: python -m podcast_feeds.validate

      - name: Commit platform link updates
        id: commit
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add shows public
          if git diff --staged --quiet; then
            echo 'No platform link changes to publish.'
            exit 0
          fi
          git commit -m "Discover podcast platform links"
          git push
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Retain validated release
        id: release
        if: steps.commit.outputs.changed == 'true' && vars.RELEASE_ARTIFACTS_ENABLED == 'true'
        env:
          R2_RELEASE_BUCKET: ${{ vars.R2_RELEASE_BUCKET }}
          R2_RELEASE_ACCOUNT_ID: ${{ secrets.R2_RELEASE_ACCOUNT_ID }}
          R2_RELEASE_ACCESS_KEY: ${{ secrets.R2_RELEASE_WRITE_ACCESS_KEY }}
          R2_RELEASE_SECRET_KEY: ${{ secrets.R2_RELEASE_WRITE_SECRET_KEY }}
        run: |
          git fetch origin main
          python -m podcast_feeds.release_pipeline prepare \
            --revision "$(git rev-parse HEAD)" --output release-bundle

      - name: Hand validated content to deployment
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          git fetch origin main
          args=()
          if [ -n "$RELEASE_ID" ]; then args+=(--release-id "$RELEASE_ID"); fi
          python -m podcast_feeds.deployment_handoff dispatch \
            --revision "$(git rev-parse HEAD)" --repo "$GITHUB_REPOSITORY" "${args[@]}"
