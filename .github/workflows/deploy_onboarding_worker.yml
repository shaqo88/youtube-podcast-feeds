name: Deploy Onboarding Worker

on:
  push:
    branches:
      - main
    paths:
      - workers/onboarding/**
      - .github/workflows/deploy_onboarding_worker.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Deploy Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler@4 deploy --config workers/onboarding/wrangler.toml

      - name: Set Worker GitHub token
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ONBOARDING_INTAKE_TOKEN: ${{ secrets.ONBOARDING_INTAKE_TOKEN }}
        run: printf '%s' "$ONBOARDING_INTAKE_TOKEN" | npx wrangler@4 secret put GITHUB_TOKEN --config workers/onboarding/wrangler.toml

      - name: Set Worker Turnstile secret
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
        run: |
          test -n "$TURNSTILE_SECRET"
          printf '%s' "$TURNSTILE_SECRET" | npx wrangler@4 secret put TURNSTILE_SECRET --config workers/onboarding/wrangler.toml
