name: Deploy Onboarding Worker

on:
  push:
    branches:
      - main
    paths:
      - workers/onboarding/**
      - .github/workflows/deploy_onboarding_worker.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Deploy Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          revision="$(git rev-parse HEAD)"
          deployed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          npx --yes wrangler@4.113.0 deploy \
            --config workers/onboarding/wrangler.toml \
            --var "BUILD_SHA:$revision" \
            --var "BUILD_TIME:$deployed_at" \
            --var "BUILD_RUN_ID:$GITHUB_RUN_ID" \
            --var "BUILD_RUN_URL:$run_url"

      - name: Set Worker GitHub token
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ONBOARDING_INTAKE_TOKEN: ${{ secrets.ONBOARDING_INTAKE_TOKEN }}
        run: printf '%s' "$ONBOARDING_INTAKE_TOKEN" | npx --yes wrangler@4.113.0 secret put GITHUB_TOKEN --config workers/onboarding/wrangler.toml

      - name: Set Worker Turnstile secret
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
        run: |
          test -n "$TURNSTILE_SECRET"
          printf '%s' "$TURNSTILE_SECRET" | npx --yes wrangler@4.113.0 secret put TURNSTILE_SECRET --config workers/onboarding/wrangler.toml
