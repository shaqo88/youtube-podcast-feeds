name: Free-Tier Health Check

env:
  NOTIFICATION_FROM_EMAIL: torahyoupod@gmail.com
  NOTIFICATION_FROM_NAME: Torah Pod

on:
  schedule:
    - cron: '29 6 * * 0'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Check hosted playback health
        id: playback_health
        continue-on-error: true
        run: |
          python -m podcast_feeds.availability \
            --catalog public/catalog.json \
            --host-prefix https://torah-pod.pages.dev/ \
            --output production-health.json

      - name: R2 usage report
        id: r2_health
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          {
            echo "# Torah Pod Weekly Usage And Status Report"
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "## Cloudflare R2"
            echo
          } | tee -a health-report.md "$GITHUB_STEP_SUMMARY"
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_ACCESS_KEY" ] || [ -z "$R2_SECRET_KEY" ] || [ -z "$R2_BUCKET" ]; then
            echo "R2 secrets are not fully configured; skipping R2 usage report." | tee -a health-report.md "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python -m podcast_feeds.r2_usage --warning-gb 7 --critical-gb 9 --json > r2-report.json
          python -m podcast_feeds.r2_usage --warning-gb 7 --critical-gb 9 | tee -a health-report.md "$GITHUB_STEP_SUMMARY"

      - name: Build per-show operational report
        id: show_health
        continue-on-error: true
        run: |
          python -m podcast_feeds.operational_health \
            --status public/status.json \
            --r2 r2-report.json \
            --availability production-health.json \
            --output show-health.json \
            --markdown show-health.md
          cat show-health.md >> health-report.md
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          report = json.loads(Path("show-health.json").read_text(encoding="utf-8"))
          counts = report["counts"]
          print("## Per-show operational health")
          print()
          print(f"- Shows: {report['show_count']} ({report['hosted_show_count']} Torah Pod-hosted)")
          print(f"- Healthy: {counts['ok']}; failing: {counts['error']}; unavailable: {counts['unavailable']}")
          print(f"- Availability provider: {report['providers']['availability']}")
          print(f"- R2 provider: {report['providers']['r2']}")
          PY

      - name: Calculate 30-day scheduled availability objective
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff="$(date -u -d '30 days ago' +%Y-%m-%d)"
          gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow production_availability.yml \
            --event schedule \
            --created ">=$cutoff" \
            --limit 3000 \
            --json status,conclusion,event,createdAt \
            > availability-runs.json
          python -m podcast_feeds.workflow_slo \
            --runs availability-runs.json \
            --window-days 30 \
            --target-percent 99.5 \
            --output availability-slo.json \
            --markdown availability-slo.md
          cat availability-slo.md | tee -a health-report.md "$GITHUB_STEP_SUMMARY"

      - name: Build critical workflow inventory
        id: workflow_health
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p workflow-runs
          for workflow in \
            sync.yml \
            credential_health.yml \
            cloudflare_pages.yml \
            pages.yml \
            deploy_onboarding_worker.yml \
            notify_new_episodes.yml \
            notify_added_podcast.yml \
            approve_onboarding.yml \
            discover_platform_links.yml
          do
            workflow_id="${workflow%.yml}"
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "$workflow" \
              --limit 20 \
              --json status,conclusion,event,createdAt,url \
              > "workflow-runs/$workflow_id.json"
          done
          workflow_health_status=0
          python -m podcast_feeds.workflow_health \
            --runs-dir workflow-runs \
            --output workflow-health.json \
            --markdown workflow-health.md || workflow_health_status=$?
          cat workflow-health.md | tee -a health-report.md "$GITHUB_STEP_SUMMARY"
          exit "$workflow_health_status"

      - name: Recent workflow status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo
            echo "## Recent Workflow Runs"
            echo
          } | tee -a health-report.md "$GITHUB_STEP_SUMMARY"
          gh run list --repo "$GITHUB_REPOSITORY" --limit 20 \
            --json workflowName,status,conclusion,event,createdAt,url \
            > recent-runs.json
          python - <<'PY' | tee -a health-report.md "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          runs = json.loads(Path("recent-runs.json").read_text(encoding="utf-8"))
          failed = [
              run for run in runs
              if run.get("status") == "completed" and run.get("conclusion") not in {"success", "skipped", "cancelled"}
          ]
          cancelled = [
              run for run in runs
              if run.get("status") == "completed" and run.get("conclusion") == "cancelled"
          ]
          print(f"- Checked recent runs: {len(runs)}")
          print(f"- Failed recent runs: {len(failed)}")
          print(f"- Cancelled recent runs: {len(cancelled)}")
          if failed:
              print()
              print("| Workflow | Conclusion | Event | Created | URL |")
              print("| --- | --- | --- | --- | --- |")
              for run in failed[:10]:
                  print(
                      f"| {run.get('workflowName')} | {run.get('conclusion')} | "
                      f"{run.get('event')} | {run.get('createdAt')} | {run.get('url')} |"
                  )
          PY

      - name: Manual account checklist
        run: |
          cat <<'EOF' | tee -a health-report.md "$GITHUB_STEP_SUMMARY"

          ## Manual Checklist

          - Cloudflare R2: warning at 7 GB, critical at 9 GB.
          - Cloudflare Pages: confirm the latest deploy succeeded after sync changes.
          - GitHub Actions: review recurring failures and long sync durations.
          - Google Drive: confirm Drive folders remain shared with the service account.
          - Gmail notifications: confirm `GMAIL_USER` and `GMAIL_APP_PASSWORD` still work.
          - YouTube cookies: refresh only after auth/bot-check failures.
          - Existing RSS feeds: keep `delivery_mode: remote` unless Torah Pod needs its own copy.
          - Donations: set `site_config.yml` `donation_url` when the public donation page is ready.
          EOF

      - name: Check mail notification secrets
        id: mail
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PODCAST_NOTIFY_EMAIL_VAR: ${{ vars.PODCAST_NOTIFY_EMAIL }}
          PODCAST_NOTIFY_EMAIL_SECRET: ${{ secrets.PODCAST_NOTIFY_EMAIL }}
          NOTIFICATION_FROM_EMAIL: ${{ env.NOTIFICATION_FROM_EMAIL }}
        run: |
          if [ -n "$GMAIL_USER" ] && [ -n "$GMAIL_APP_PASSWORD" ] && [ "$GMAIL_USER" = "$NOTIFICATION_FROM_EMAIL" ]; then
            notify_to="${PODCAST_NOTIFY_EMAIL_SECRET:-${PODCAST_NOTIFY_EMAIL_VAR:-$GMAIL_USER}}"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "to=$notify_to" >> "$GITHUB_OUTPUT"
          else
            if [ -n "$GMAIL_USER" ] && [ "$GMAIL_USER" != "$NOTIFICATION_FROM_EMAIL" ]; then
              echo "::warning::GMAIL_USER must be $NOTIFICATION_FROM_EMAIL for Torah Pod notification mail."
            fi
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare email report
        id: email
        run: |
          python - <<'PY'
          import html
          import json
          import os
          from pathlib import Path

          def load_json(path):
              file = Path(path)
              if not file.exists():
                  return None
              return json.loads(file.read_text(encoding="utf-8"))

          def fmt_bytes(value):
              value = int(value or 0)
              gb = 1024 ** 3
              mb = 1024 ** 2
              kb = 1024
              if value >= gb:
                  return f"{value / gb:.2f} GB"
              if value >= mb:
                  return f"{value / mb:.2f} MB"
              if value >= kb:
                  return f"{value / kb:.2f} KB"
              return f"{value} B"

          def esc(value):
              return html.escape("" if value is None else str(value), quote=True)

          r2 = load_json("r2-report.json")
          show_health = load_json("show-health.json") or {"shows": [], "counts": {}}
          availability_slo = load_json("availability-slo.json") or {}
          workflow_health = load_json("workflow-health.json") or {"workflows": [], "counts": {}}
          workflow_issues = [
              item for item in workflow_health.get("workflows", [])
              if item.get("status") in {"warning", "error"}
          ]
          runs = load_json("recent-runs.json") or []
          failed = [
              run for run in runs
              if run.get("status") == "completed" and run.get("conclusion") not in {"success", "skipped", "cancelled"}
          ]
          cancelled = [
              run for run in runs
              if run.get("status") == "completed" and run.get("conclusion") == "cancelled"
          ]
          run_url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"

          if r2:
              status = str(r2.get("status") or "unknown")
              total = fmt_bytes(r2.get("total_bytes"))
              objects = str(r2.get("total_objects") or 0)
              prefixes = r2.get("prefixes") or []
          else:
              status = "unknown"
              total = "unavailable"
              objects = "unavailable"
              prefixes = []

          status_color = {
              "ok": "#0f766e",
              "warning": "#b7791f",
              "critical": "#b42318",
          }.get(status, "#64748b")
          availability_rate = availability_slo.get("success_percent")
          availability_rate_text = (
              "collecting"
              if availability_rate is None
              else f"{float(availability_rate):.3f}%"
          )

          prefix_rows = "\n".join(
              f"""
              <tr>
                <td><code>{esc(item.get('prefix'))}</code></td>
                <td>{esc(item.get('show_slug'))}</td>
                <td class="number">{esc(fmt_bytes(item.get('bytes')))}</td>
                <td class="number">{esc(item.get('objects'))}</td>
              </tr>
              """
              for item in prefixes
          ) or '<tr><td colspan="4">No R2 objects found or R2 report unavailable.</td></tr>'

          show_rows = "\n".join(
              f"""
              <tr>
                <td><code>{esc(show.get('slug'))}</code></td>
                <td>{esc(show.get('hosting'))}</td>
                <td>{esc(show.get('status'))}</td>
                <td class="number">{esc(show.get('episode_count'))}</td>
                <td class="number">{esc((show.get('latest_episode') or {}).get('age_days'))}</td>
                <td>{esc((show.get('feed_health') or {}).get('status'))}</td>
                <td>{'yes' if (show.get('feed_health') or {}).get('range_supported') else '-'}</td>
                <td>{esc((show.get('directories') or {}).get('apple', {}).get('status'))}</td>
                <td>{esc((show.get('directories') or {}).get('spotify', {}).get('status'))}</td>
              </tr>
              """
              for show in show_health.get("shows", [])
          ) or '<tr><td colspan="9">Per-show health report unavailable.</td></tr>'

          failed_rows = "\n".join(
              f"""
              <tr>
                <td>{esc(run.get('workflowName'))}</td>
                <td>{esc(run.get('conclusion'))}</td>
                <td>{esc(run.get('event'))}</td>
                <td>{esc(run.get('createdAt'))}</td>
                <td><a href="{esc(run.get('url'))}">Open</a></td>
              </tr>
              """
              for run in failed[:10]
          ) or '<tr><td colspan="5">No failed or cancelled runs in the last 20 workflow runs.</td></tr>'

          workflow_rows = "\n".join(
              f"""
              <tr>
                <td>{esc(item.get('label'))}</td>
                <td>{esc(item.get('status'))}</td>
                <td>{esc(item.get('last_completed_conclusion'))}</td>
                <td class="number">{esc(item.get('last_completed_age_hours'))}</td>
                <td>{esc(item.get('issue') or '-')}</td>
                <td><a href="{esc(item.get('url'))}">Open</a></td>
              </tr>
              """
              for item in workflow_health.get("workflows", [])
          ) or '<tr><td colspan="6">Critical workflow inventory unavailable.</td></tr>'

          html_body = f"""<!doctype html>
          <html>
          <head>
            <meta charset="utf-8">
            <style>
              body {{
                margin: 0;
                background: #f7efdf;
                color: #17213b;
                font-family: Arial, sans-serif;
                line-height: 1.45;
              }}
              .wrap {{
                max-width: 760px;
                margin: 0 auto;
                padding: 24px;
              }}
              .hero {{
                border-radius: 22px;
                padding: 26px;
                background: linear-gradient(135deg, #fffaf0, #e4f3ed);
                border: 1px solid #ead7b7;
              }}
              h1, h2 {{
                margin: 0 0 12px;
                color: #12284d;
              }}
              .cards {{
                display: grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 12px;
                margin: 18px 0;
              }}
              .card {{
                border-radius: 16px;
                background: #fffaf0;
                border: 1px solid #ead7b7;
                padding: 16px;
              }}
              .label {{
                color: #6c604e;
                font-size: 12px;
                font-weight: bold;
                text-transform: uppercase;
              }}
              .value {{
                display: block;
                margin-top: 6px;
                color: #12284d;
                font-size: 24px;
                font-weight: bold;
              }}
              .status {{
                color: {status_color};
              }}
              table {{
                width: 100%;
                border-collapse: collapse;
                margin: 12px 0 24px;
                background: #fffaf0;
                border-radius: 14px;
                overflow: hidden;
              }}
              th, td {{
                padding: 10px;
                border-bottom: 1px solid #ead7b7;
                text-align: left;
                vertical-align: top;
              }}
              th {{
                background: #e4f3ed;
                color: #12284d;
              }}
              .number {{
                text-align: right;
                white-space: nowrap;
              }}
              .checklist {{
                border-radius: 16px;
                background: #fffaf0;
                border: 1px solid #ead7b7;
                padding: 16px 22px;
              }}
              a {{
                color: #0f766e;
                font-weight: bold;
              }}
              code {{
                font-family: Consolas, monospace;
              }}
            </style>
          </head>
          <body>
            <div class="wrap">
              <div class="hero">
                <h1>Torah Pod Weekly Usage And Status Report</h1>
                <p>Weekly infrastructure health report for the podcast platform.</p>
                <p><a href="{esc(run_url)}">Open GitHub Actions run</a></p>
              </div>

              <div class="cards">
                <div class="card">
                  <span class="label">R2 Status</span>
                  <span class="value status">{esc(status.upper())}</span>
                </div>
                <div class="card">
                  <span class="label">R2 Storage</span>
                  <span class="value">{esc(total)}</span>
                </div>
                <div class="card">
                  <span class="label">Workflow Issues</span>
                  <span class="value">{len(workflow_issues)}</span>
                </div>
                <div class="card">
                  <span class="label">30-day Availability</span>
                  <span class="value">{esc(availability_rate_text)}</span>
                </div>
              </div>

              <h2>Scheduled Availability Objective</h2>
              <p>Status: <strong>{esc(availability_slo.get('status') or 'unavailable')}</strong>.
              Target: {esc(availability_slo.get('target_percent'))}% over {esc(availability_slo.get('window_days'))} days.
              Completed checks: {esc(availability_slo.get('completed_runs'))}; unsuccessful: {esc(availability_slo.get('unsuccessful_runs'))};
              history coverage: {esc(availability_slo.get('coverage_days'))} days.</p>

              <h2>R2 Usage By Prefix</h2>
              <table>
                <thead>
                  <tr>
                    <th>Prefix</th>
                    <th>Show</th>
                    <th class="number">Size</th>
                    <th class="number">Objects</th>
                  </tr>
                </thead>
                <tbody>{prefix_rows}</tbody>
              </table>

              <h2>Per-show Operational Health</h2>
              <table>
                <thead>
                  <tr>
                    <th>Show</th>
                    <th>Hosting</th>
                    <th>Health</th>
                    <th class="number">Episodes</th>
                    <th class="number">Latest age</th>
                    <th>Feed</th>
                    <th>Range</th>
                    <th>Apple</th>
                    <th>Spotify</th>
                  </tr>
                </thead>
                <tbody>{show_rows}</tbody>
              </table>

              <h2>Workflow Status</h2>
              <p>Inventory status: <strong>{esc(workflow_health.get('status') or 'unavailable')}</strong>.</p>
              <table>
                <thead>
                  <tr>
                    <th>Workflow</th>
                    <th>State</th>
                    <th>Last conclusion</th>
                    <th class="number">Age (hours)</th>
                    <th>Issue</th>
                    <th>Link</th>
                  </tr>
                </thead>
                <tbody>{workflow_rows}</tbody>
              </table>

              <h2>Recent Cross-workflow Failures</h2>
              <p>Checked recent runs: <strong>{len(runs)}</strong>. Failed: <strong>{len(failed)}</strong>. Cancelled: <strong>{len(cancelled)}</strong>.</p>
              <table>
                <thead>
                  <tr>
                    <th>Workflow</th>
                    <th>Conclusion</th>
                    <th>Event</th>
                    <th>Created</th>
                    <th>Link</th>
                  </tr>
                </thead>
                <tbody>{failed_rows}</tbody>
              </table>

              <h2>Manual Checklist</h2>
              <ul class="checklist">
                <li>R2 warning threshold: 7 GB. Critical threshold: 9 GB.</li>
                <li>Confirm Cloudflare Pages deploys are succeeding after sync changes.</li>
                <li>Confirm Drive folders remain shared with the service account.</li>
                <li>Refresh YouTube cookies only after auth or bot-check failures.</li>
                <li>Keep existing RSS feeds in <code>delivery_mode: remote</code> unless Torah Pod needs its own copy.</li>
              </ul>
            </div>
          </body>
          </html>
          """
          Path("health-report.html").write_text(html_body, encoding="utf-8")
          PY
          echo "subject=Torah Pod weekly usage and status report" >> "$GITHUB_OUTPUT"

      - name: Send weekly usage and status report
        if: steps.mail.outputs.enabled == 'true'
        uses: dawidd6/action-send-mail@94de994a9f6fffee200243214e17002e2920bb59  # v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: ${{ steps.email.outputs.subject }}
          to: ${{ steps.mail.outputs.to }}
          from: ${{ env.NOTIFICATION_FROM_NAME }} <${{ env.NOTIFICATION_FROM_EMAIL }}>
          body: file://health-report.md
          html_body: file://health-report.html

      - name: Enforce hosted operational health
        if: always()
        env:
          PLAYBACK_OUTCOME: ${{ steps.playback_health.outcome }}
          SHOW_HEALTH_OUTCOME: ${{ steps.show_health.outcome }}
          WORKFLOW_HEALTH_OUTCOME: ${{ steps.workflow_health.outcome }}
          MAIL_ENABLED: ${{ steps.mail.outputs.enabled }}
        run: |
          if [ "$PLAYBACK_OUTCOME" != "success" ] || [ "$SHOW_HEALTH_OUTCOME" != "success" ] || [ "$WORKFLOW_HEALTH_OUTCOME" != "success" ] || [ "$MAIL_ENABLED" != "true" ]; then
            echo "::error::Hosted playback, per-show health, critical workflow inventory, or weekly report mail configuration failed."
            exit 1
          fi

      - name: Prepare health check failure notification
        id: failure_email
        if: failure()
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PODCAST_NOTIFY_EMAIL_VAR: ${{ vars.PODCAST_NOTIFY_EMAIL }}
          PODCAST_NOTIFY_EMAIL_SECRET: ${{ secrets.PODCAST_NOTIFY_EMAIL }}
          NOTIFICATION_FROM_EMAIL: ${{ env.NOTIFICATION_FROM_EMAIL }}
        run: |
          if [ -z "$GMAIL_USER" ] || [ -z "$GMAIL_APP_PASSWORD" ] || [ "$GMAIL_USER" != "$NOTIFICATION_FROM_EMAIL" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          notify_to="${PODCAST_NOTIFY_EMAIL_SECRET:-${PODCAST_NOTIFY_EMAIL_VAR:-$GMAIL_USER}}"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "to=$notify_to" >> "$GITHUB_OUTPUT"
          echo "subject=Torah Pod weekly health check failed" >> "$GITHUB_OUTPUT"
          delimiter="HEALTH_FAILURE_BODY_$(date +%s%N)"
          {
            echo "body<<$delimiter"
            echo "The weekly Torah Pod health check did not complete."
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Repository: $GITHUB_REPOSITORY"
            echo
            echo "Open the run to identify whether R2, GitHub Actions, or email reporting needs attention."
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Notify on weekly health check failure
        if: failure() && steps.failure_email.outputs.enabled == 'true'
        continue-on-error: true
        uses: dawidd6/action-send-mail@94de994a9f6fffee200243214e17002e2920bb59  # v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: ${{ steps.failure_email.outputs.subject }}
          to: ${{ steps.failure_email.outputs.to }}
          from: ${{ env.NOTIFICATION_FROM_NAME }} <${{ env.NOTIFICATION_FROM_EMAIL }}>
          body: ${{ steps.failure_email.outputs.body }}
