name: Sync Queue Health

on:
  schedule:
    - cron: '11 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    if: vars.R2_STATE_BUCKET != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
      R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
      R2_STATE_ACCOUNT_ID: ${{ secrets.R2_STATE_ACCOUNT_ID }}
      R2_STATE_ACCESS_KEY: ${{ secrets.R2_STATE_ACCESS_KEY }}
      R2_STATE_SECRET_KEY: ${{ secrets.R2_STATE_SECRET_KEY }}
      R2_STATE_BUCKET: ${{ vars.R2_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - name: Inspect durable sync state
        id: state
        run: |
          python -m podcast_feeds.sync_state health --persist --output sync-health.json
          python -c 'import json,os; r=json.load(open("sync-health.json")); f=open(os.environ["GITHUB_OUTPUT"],"a"); print("status="+r["status"],file=f); print("transition="+(r.get("notification_transition") or ""),file=f)'
          cat sync-health.json >> "$GITHUB_STEP_SUMMARY"
      - name: Send incident transition
        if: steps.state.outputs.transition != ''
        uses: dawidd6/action-send-mail@94de994a9f6fffee200243214e17002e2920bb59  # v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: Torah Pod sync ${{ steps.state.outputs.transition }} (${{ steps.state.outputs.status }})
          to: ${{ secrets.PODCAST_NOTIFY_EMAIL || secrets.GMAIL_USER }}
          from: Torah Pod <torahyoupod@gmail.com>
          body: Review the Sync Queue Health workflow summary for queue age, stale discovery, and recording readiness details.
      - name: Enforce queue health
        if: steps.state.outputs.status == 'error'
        run: exit 1
