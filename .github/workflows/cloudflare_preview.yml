name: Deploy UX Redesign Preview

on:
  push:
    branches:
      - ux/torah-pod-0.4.0
    paths:
      - public/**
      - podcast_feeds/**
      - tests/**
      - .github/workflows/cloudflare_preview.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-ux-redesign
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
      PROJECT_NAME: torah-pod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Verify generated site and contracts
        run: |
          python -m unittest discover -s tests
          node --test tests/site_assets.test.mjs workers/onboarding/test/submit.test.mjs

      - name: Prepare preview site
        run: |
          cp -R public public-dist
          python -m podcast_feeds.deployment_manifest \
            --target cloudflare-pages-preview \
            --revision "$(git rev-parse HEAD)" \
            --run-id "$GITHUB_RUN_ID" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --output public-dist/deployment.json

      - name: Deploy isolated branch preview
        run: npx --yes wrangler@4.113.0 pages deploy public-dist --project-name "$PROJECT_NAME" --branch ux-redesign
