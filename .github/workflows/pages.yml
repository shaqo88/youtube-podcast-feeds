name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - public/**
      - .github/workflows/pages.yml
  workflow_dispatch:
    inputs:
      revision:
        description: "Exact validated main commit to deploy. Leave empty for manual latest-main recovery."
        required: false
        default: ""
      force:
        description: "Redeploy the same live revision for manual recovery."
        required: false
        type: boolean
        default: false
      release_id:
        description: "Retained validated release ID. Empty keeps the existing Git deployment path."
        required: false
        default: ""

permissions:
  contents: read
  actions: write
  pages: write
  id-token: write

concurrency:
  group: pages
  queue: max
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0

      - name: Check exact deployment revision
        id: handoff
        env:
          REVISION: ${{ inputs.revision || github.sha }}
          FORCE: ${{ inputs.force }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          git fetch origin main
          args=()
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          if [ -n "$RELEASE_ID" ]; then args+=(--release-id "$RELEASE_ID"); fi
          python -m podcast_feeds.deployment_handoff preflight \
            --revision "$REVISION" --target github-pages "${args[@]}"

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
        if: steps.handoff.outputs.deploy == 'true'

      - name: Fetch and verify retained release
        id: artifact
        if: steps.handoff.outputs.deploy == 'true' && inputs.release_id != ''
        env:
          R2_RELEASE_BUCKET: ${{ vars.R2_RELEASE_BUCKET }}
          R2_RELEASE_ACCOUNT_ID: ${{ secrets.R2_RELEASE_ACCOUNT_ID }}
          R2_RELEASE_ACCESS_KEY: ${{ secrets.R2_RELEASE_ACCESS_KEY }}
          R2_RELEASE_SECRET_KEY: ${{ secrets.R2_RELEASE_SECRET_KEY }}
          RELEASE_ID: ${{ inputs.release_id }}
          REVISION: ${{ inputs.revision || github.sha }}
        run: |
          python -m pip install --requirement requirements.txt
          python -m podcast_feeds.release_pipeline fetch \
            --revision "$REVISION" --release-id "$RELEASE_ID" \
            --bundle-dir release-download --destination public-dist

      - name: Prepare legacy public site
        if: steps.handoff.outputs.deploy == 'true' && inputs.release_id == ''
        run: |
          python scripts/check-public-accounts.py
          cp -R public public-dist

      - name: Add target-specific deployment receipt
        if: steps.handoff.outputs.deploy == 'true'
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          PAYLOAD_DIGEST: ${{ steps.artifact.outputs.payload_digest }}
        run: |
          python scripts/check-public-accounts.py
          args=()
          if [ -n "$RELEASE_ID" ]; then args+=(--release-id "$RELEASE_ID" --payload-digest "$PAYLOAD_DIGEST"); fi
          python -m podcast_feeds.deployment_manifest \
            --target github-pages \
            --revision "$(git rev-parse HEAD)" \
            --run-id "$GITHUB_RUN_ID" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --output public-dist/deployment.json "${args[@]}"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        if: steps.handoff.outputs.deploy == 'true'
        with:
          path: public-dist

      - name: Check main again immediately before deployment
        id: latest
        if: steps.handoff.outputs.deploy == 'true'
        env:
          REVISION: ${{ inputs.revision || github.sha }}
          FORCE: ${{ inputs.force }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          git fetch origin main
          args=()
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          if [ -n "$RELEASE_ID" ]; then args+=(--release-id "$RELEASE_ID"); fi
          python -m podcast_feeds.deployment_handoff preflight \
            --revision "$REVISION" --target github-pages "${args[@]}"

      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
        if: steps.handoff.outputs.deploy == 'true' && steps.latest.outputs.deploy == 'true'
        continue-on-error: true

      - name: Wait before retrying Pages deploy
        if: steps.handoff.outputs.deploy == 'true' && steps.latest.outputs.deploy == 'true' && steps.deployment.outcome == 'failure'
        run: sleep 30

      - id: deployment_retry
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
        if: steps.handoff.outputs.deploy == 'true' && steps.latest.outputs.deploy == 'true' && steps.deployment.outcome == 'failure'

      - name: Verify exact live revision
        if: steps.handoff.outputs.deploy == 'true' && steps.latest.outputs.deploy == 'true' && (steps.deployment.outcome == 'success' || steps.deployment_retry.outcome == 'success')
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          PAYLOAD_DIGEST: ${{ steps.artifact.outputs.payload_digest }}
        run: |
          args=()
          if [ -n "$RELEASE_ID" ]; then args+=(--release-id "$RELEASE_ID" --payload-digest "$PAYLOAD_DIGEST"); fi
          python -m podcast_feeds.deployment_handoff verify \
            --revision "$(git rev-parse HEAD)" --target github-pages "${args[@]}"

      - name: Hand newer main content to deployment
        if: steps.handoff.outputs.deploy == 'true' && steps.latest.outputs.deploy == 'true' && (steps.deployment.outcome == 'success' || steps.deployment_retry.outcome == 'success')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          python -m podcast_feeds.deployment_handoff reconcile \
            --revision "$(git rev-parse HEAD)" --target github-pages --repo "$GITHUB_REPOSITORY"
