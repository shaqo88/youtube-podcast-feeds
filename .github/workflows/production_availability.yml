name: Production Availability Monitor

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Check public endpoints
        id: availability
        run: |
          set -euo pipefail
          check() {
            local name="$1"
            local url="$2"
            local required="$3"
            local body
            body="$(curl --fail --silent --show-error --location --max-time 20 --retry 2 "$url")"
            if [[ "$body" != *"$required"* ]]; then
              echo "::error::$name did not contain its expected response marker."
              exit 1
            fi
            echo "✓ $name"
          }
          check_json() {
            local name="$1"
            local url="$2"
            local validator="$3"
            local body
            body="$(curl --fail --silent --show-error --location --max-time 20 --retry 2 "$url")"
            if ! printf '%s' "$body" | python3 -c "$validator"; then
              echo "::error::$name did not match its expected JSON structure."
              exit 1
            fi
            echo "✓ $name"
          }
          check_headers() {
            local name="$1"
            local url="$2"
            local output="$3"
            curl --fail --silent --show-error --location --max-time 20 --retry 2 \
              --dump-header "$output" --output /dev/null "$url"
            header() {
              local key="$1"
              grep --ignore-case --max-count=1 "^${key}:" "$output" \
                | cut --delimiter=: --fields=2- \
                | sed 's/^[[:space:]]*//; s/[[:space:]\r]*$//'
            }
            require_contains() {
              local key="$1"
              local expected="$2"
              local value
              value="$(header "$key")"
              if [[ "$value" != *"$expected"* ]]; then
                echo "::error::$name $key header is missing $expected."
                exit 1
              fi
            }
            require_contains "Cache-Control" "max-age=0"
            require_contains "Cache-Control" "must-revalidate"
            require_contains "Content-Security-Policy" "script-src-attr 'none'"
            require_contains "Content-Security-Policy" "style-src 'self'; style-src-attr 'none'"
            require_contains "Content-Security-Policy" "https://challenges.cloudflare.com"
            if [[ "$(header Content-Security-Policy)" == *"unsafe-inline"* ]]; then
              echo "::error::$name CSP unexpectedly permits unsafe-inline."
              exit 1
            fi
            require_contains "Strict-Transport-Security" "max-age=31536000"
            require_contains "X-Frame-Options" "DENY"
            require_contains "X-Permitted-Cross-Domain-Policies" "none"
            require_contains "Cross-Origin-Opener-Policy" "same-origin"
            require_contains "Cross-Origin-Resource-Policy" "same-site"
            require_contains "Origin-Agent-Cluster" "?1"
            echo "✓ $name headers"
          }
          check "Cloudflare Pages home" "https://torah-pod.pages.dev/" "Torah Pod"
          check "Cloudflare Pages onboarding" "https://torah-pod.pages.dev/onboard/" "data-turnstile-site-key"
          check "Cloudflare Pages service worker" "https://torah-pod.pages.dev/sw.js" "torah-pod-shell-"
          check_json "Cloudflare Pages catalog" "https://torah-pod.pages.dev/catalog.json" 'import json, sys; items=json.load(sys.stdin); assert isinstance(items, list) and items and all(isinstance(item.get("slug"), str) and isinstance(item.get("feed_url"), str) for item in items)'
          check_json "Cloudflare Pages catalog contract" "https://torah-pod.pages.dev/catalog-meta.json" 'import json, sys; meta=json.load(sys.stdin); assert meta.get("schema_version") == 1 and meta.get("top_level") == "array" and meta.get("item_identity") == "slug" and meta.get("catalog_url") == "catalog.json"'
          check_json "Cloudflare Pages status" "https://torah-pod.pages.dev/status.json" 'import json, sys; status=json.load(sys.stdin); assert isinstance(status, dict) and isinstance(status.get("shows"), list) and isinstance(status.get("show_count"), int)'
          check "GitHub Pages home" "https://shaqo88.github.io/youtube-podcast-feeds/" "Torah Pod"
          check "Onboarding Worker" "https://youtube-podcast-onboarding.shauldr.workers.dev/health" '"ok":true'
          check_headers "Cloudflare Pages home" "https://torah-pod.pages.dev/" "home-headers.txt"
          check_headers "Cloudflare Pages service worker" "https://torah-pod.pages.dev/sw.js" "sw-headers.txt"
          check_headers "Cloudflare Pages catalog" "https://torah-pod.pages.dev/catalog.json" "catalog-headers.txt"
          python3 -m podcast_feeds.availability \
            --catalog public/catalog.json \
            --host-prefix https://torah-pod.pages.dev/ \
            --output production-health.json

      - name: Prepare state-transition notification
        id: email
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_OUTCOME: ${{ steps.availability.outcome }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PODCAST_NOTIFY_EMAIL_VAR: ${{ vars.PODCAST_NOTIFY_EMAIL }}
          PODCAST_NOTIFY_EMAIL_SECRET: ${{ secrets.PODCAST_NOTIFY_EMAIL }}
        run: |
          previous_conclusion="$(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow production_availability.yml \
              --limit 10 \
              --json status,conclusion \
              --jq 'map(select(.status == "completed")) | .[0].conclusion // "unknown"'
          )"
          transition="$(python3 -c 'import sys; from podcast_feeds.availability import notification_transition; print(notification_transition(sys.argv[1], sys.argv[2]))' "$CURRENT_OUTCOME" "$previous_conclusion")"
          echo "Current outcome: $CURRENT_OUTCOME; previous conclusion: $previous_conclusion; transition: $transition" >> "$GITHUB_STEP_SUMMARY"

          if [ "$transition" = "none" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$GMAIL_USER" ] || [ -z "$GMAIL_APP_PASSWORD" ]; then
            echo "::warning::Availability changed state, but notification mail is not configured."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "to=${PODCAST_NOTIFY_EMAIL_SECRET:-${PODCAST_NOTIFY_EMAIL_VAR:-$GMAIL_USER}}" >> "$GITHUB_OUTPUT"
          if [ "$transition" = "failure" ]; then
            echo "subject=Torah Pod production availability failed" >> "$GITHUB_OUTPUT"
            echo "body=Torah Pod changed from available to failing. Open $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID for the affected endpoint or show." >> "$GITHUB_OUTPUT"
          else
            echo "subject=Torah Pod production availability recovered" >> "$GITHUB_OUTPUT"
            echo "body=Torah Pod production availability checks recovered. Confirmation run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          fi

      - name: Email availability state transition
        if: always() && steps.email.outputs.enabled == 'true'
        continue-on-error: true
        uses: dawidd6/action-send-mail@d38f3f7cd391cdebfe0d38efc3998b935e951c4f  # v16
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: ${{ steps.email.outputs.subject }}
          to: ${{ steps.email.outputs.to }}
          from: Torah Pod <${{ secrets.GMAIL_USER }}>
          body: ${{ steps.email.outputs.body }}
