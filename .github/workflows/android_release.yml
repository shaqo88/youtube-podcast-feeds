name: Build Android Release Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-candidate
  cancel-in-progress: false

jobs:
  signed-candidate:
    runs-on: windows-latest
    timeout-minutes: 25
    environment: google-play-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95  # v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699  # v4.0.1

      - name: Install pinned Android SDK components
        shell: pwsh
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Download and verify bundletool
        shell: pwsh
        run: |
          $bundletool = Join-Path $env:RUNNER_TEMP "bundletool-all-1.18.3.jar"
          Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar" -OutFile $bundletool
          $actual = (Get-FileHash -LiteralPath $bundletool -Algorithm SHA256).Hash
          $expected = "A099CFA1543F55593BC2ED16A70A7C67FE54B1747BB7301F37FDFD6D91028E29"
          if ($actual -ne $expected) {
            throw "bundletool checksum mismatch: $actual"
          }
          "BUNDLETOOL_JAR=$bundletool" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Test source and build signed APK/AAB
        id: build
        shell: pwsh
        env:
          ANDROID_BUILD_TOOLS_VERSION: 36.0.0
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          TORAH_POD_RELEASE_KEY_ALIAS: ${{ secrets.TORAH_POD_RELEASE_KEY_ALIAS }}
          TORAH_POD_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.TORAH_POD_RELEASE_KEYSTORE_PASSWORD }}
          TORAH_POD_RELEASE_KEY_PASSWORD: ${{ secrets.TORAH_POD_RELEASE_KEY_PASSWORD }}
        run: |
          $required = @(
            "ANDROID_RELEASE_KEYSTORE_BASE64",
            "TORAH_POD_RELEASE_KEY_ALIAS",
            "TORAH_POD_RELEASE_KEYSTORE_PASSWORD",
            "TORAH_POD_RELEASE_KEY_PASSWORD"
          )
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Required google-play-release environment secret is missing: $name"
            }
          }

          $keystore = Join-Path $env:RUNNER_TEMP "torah-pod-upload.jks"
          try {
            [IO.File]::WriteAllBytes(
              $keystore,
              [Convert]::FromBase64String($env:ANDROID_RELEASE_KEYSTORE_BASE64)
            )
            $env:TORAH_POD_RELEASE_KEYSTORE = $keystore

            .\android-wrapper\set-release-version.ps1 -Check
            .\android-wrapper\test-bridge-policy.ps1
            python -m unittest tests.test_android_wrapper_source
            .\android-wrapper\build-apk.ps1 -Configuration release -Bundle

            $version = Get-Content -Raw .\android-wrapper\release-version.json | ConvertFrom-Json
            $apkHash = (Get-FileHash .\android-wrapper\build\torah-pod-release.apk -Algorithm SHA256).Hash
            $aabHash = (Get-FileHash .\android-wrapper\build\torah-pod-release.aab -Algorithm SHA256).Hash
            [ordered]@{
              schemaVersion = 1
              packageName = "com.torahpod.app"
              versionName = [string]$version.versionName
              versionCode = [int]$version.versionCode
              sourceCommit = "${{ github.sha }}"
              workflowRun = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              apkSha256 = $apkHash
              aabSha256 = $aabHash
              builtAt = [DateTime]::UtcNow.ToString("o")
            } | ConvertTo-Json | Set-Content .\android-wrapper\build\release-metadata.json -Encoding utf8

            "version_name=$($version.versionName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "version_code=$($version.versionCode)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } finally {
            Remove-Item -LiteralPath $keystore -Force -ErrorAction SilentlyContinue
            Remove-Item Env:TORAH_POD_RELEASE_KEYSTORE -ErrorAction SilentlyContinue
          }

      - name: Retain candidate and provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: torah-pod-${{ steps.build.outputs.version_name }}-${{ steps.build.outputs.version_code }}
          path: |
            android-wrapper/build/torah-pod-release.aab
            android-wrapper/build/torah-pod-release.apk
            android-wrapper/build/release-metadata.json
          if-no-files-found: error
          retention-days: 30
