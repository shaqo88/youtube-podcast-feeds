name: Validate Podcast Feeds

on:
  schedule:
    - cron: '37 * * * *'
  push:
    branches:
      - main
    paths:
      - .github/workflows/**
      - podcast_feeds/**
      - public/**
      - requirements.txt
      - shows/**
      - tests/**
      - workers/onboarding/**
  pull_request:
    paths:
      - .github/dependabot.yml
      - .github/workflows/**
      - podcast_feeds/**
      - public/**
      - requirements.txt
      - shows/**
      - tests/**
      - workers/onboarding/**
  workflow_dispatch:
    inputs:
      show:
        description: "Show slug. Leave empty to validate all enabled shows."
        required: false
        default: ""
      network:
        description: "Validate published feed/artwork/media."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Build feeds
        env:
          SHOW: ${{ inputs.show }}
        run: |
          if [ -n "$SHOW" ]; then
            python -m podcast_feeds.build --show "$SHOW"
          else
            python -m podcast_feeds.build
          fi

      - name: Validate feeds
        env:
          SHOW: ${{ inputs.show }}
          NETWORK: ${{ inputs.network }}
        run: |
          args=""
          if [ -n "$SHOW" ]; then
            args="$args --show $SHOW"
          fi
          if [ "$NETWORK" = "true" ]; then
            args="$args --network"
          fi
          python -m podcast_feeds.validate $args

      - name: Run Python unit and recovery tests
        run: python -m unittest discover -s tests

      - name: Test website assets and onboarding worker
        run: node --test tests/site_assets.test.mjs workers/onboarding/test/submit.test.mjs
