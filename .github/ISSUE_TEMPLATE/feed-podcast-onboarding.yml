name: Existing Feed Podcast Onboarding
description: Request listing and syncing an existing podcast RSS/Atom feed.
title: "Existing feed onboarding: <podcast title>"
labels:
  - feed-onboarding
  - needs-approval
body:
  - type: markdown
    attributes:
      value: |
        Use this form to request adding an existing podcast feed to Torah Pod.

        Torah Pod approval is required before the feed is listed.
  - type: input
    id: existing_feed_url
    attributes:
      label: Existing podcast feed URL
      description: RSS or Atom feed URL. Torah Pod can use the feed metadata for title, author, artwork, and episodes.
      placeholder: https://example.com/feed.xml
    validations:
      required: true
  - type: input
    id: podcast_title
    attributes:
      label: Podcast title
      description: Optional. If blank, Torah Pod can use the title from the feed.
      placeholder: שיעורי הרב ...
    validations:
      required: false
  - type: input
    id: author
    attributes:
      label: Speaker / rabbi
      description: Optional if the feed contains a clear author.
      placeholder: הרב ...
    validations:
      required: false
  - type: input
    id: feed_slug
    attributes:
      label: Feed slug
      description: Optional. Lowercase English letters, numbers, and hyphens only. If blank, Torah Pod generates one.
      placeholder: rav-example
    validations:
      required: false
  - type: input
    id: start_date
    attributes:
      label: Start date
      description: Optional for existing feeds. If blank, all available feed episodes are eligible.
      placeholder: "2026-06-24"
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Optional. If blank, Torah Pod can use the description from the feed.
    validations:
      required: false
  - type: input
    id: artwork
    attributes:
      label: Artwork URL
      description: Optional if the feed contains artwork.
      placeholder: https://...
    validations:
      required: false
  - type: input
    id: contact_email
    attributes:
      label: Contact email
      description: Optional.
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Optional special instructions.
    validations:
      required: false
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I understand this request requires Torah Pod approval before the feed is listed.
          required: true
