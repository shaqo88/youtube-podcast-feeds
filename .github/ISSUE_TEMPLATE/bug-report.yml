name: Developer feedback
description: Report a bug or suggest an improvement to Torah Pod.
title: "Developer feedback: "
labels:
  - feedback
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Torah Pod. Do not include private
        credentials, personal information, or podcast onboarding details here.
  - type: textarea
    id: feedback
    attributes:
      label: Feedback
      description: Describe the problem, suggestion, or question.
    validations:
      required: true
