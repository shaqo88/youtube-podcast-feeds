  description: 'צאו איתנו למסע העוקב אחר תולדותיה של חסידות חב״ד, מיום היווסדה על
    ידי רבנו הזקן, בעל ה"תניא", ועד להפיכתה לתנועה חובקת עולם הפועלת להבאת הגאולה.
    בכל פרק נצלול לתוך תקופה, שלב, או דמות מפתח - משבעה דורות של נשיאות, דרך מסירות
    נפש הרדיפות תחת השלטון הרוסי, ועד שיגור אלפי שלוחים לכל קצוות תבל. זהו מסע רוחני-היסטורי
    בעקבות הדרישה: "כי קרוב אליך הדבר מאוד - בפיך ובלבבך לעשותו" - לראות כיצד רעיונות
    נעלים הפכו לכוח מניע של חיים ושליחות יהודית בדורות האחרונים.'
