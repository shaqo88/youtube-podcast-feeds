  <script>
    const labels = {"he": {"dir": "rtl", "lang": "he", "home": "בית", "shows": "פודקאסטים", "latest": "פרקים חדשים", "all_shows": "כל הפודקאסטים", "listen": "האזנה", "feed": "RSS", "onboard": "צירוף", "status": "סטטוס", "contact": "יצירת קשר", "contact_title": "יצירת קשר", "contact_text": "יש שאלה, הצעה או בקשה לצירוף פודקאסט? אפשר לכתוב ישירות ל-Torah Pod.", "contact_name": "שם", "contact_email": "אימייל", "contact_message": "הודעה", "contact_submit": "פתיחת אימייל", "donate": "תרומה", "donate_title": "תמיכה ב-Torah Pod", "donate_text": "אם המיזם מועיל לך, אפשר להשתתף בהחזקת המערכת דרך Bit או PayBox.", "episodes": "פרקים", "source": "מקור", "search": "חיפוש", "search_placeholder": "חפשו שיעור או רב", "search_podcasts": "חיפוש פודקאסטים", "search_podcasts_placeholder": "חפשו לפי שם פודקאסט או רב", "podcast_filter": "סינון פודקאסטים", "filter_all": "הכל", "filter_hosted": "Torah Pod", "filter_external": "פידים חיצוניים", "search_episodes": "חיפוש פרקים", "search_episodes_placeholder": "חפשו לפי שם שיעור או תיאור", "show_more": "הצג עוד", "empty": "עדיין אין פרקים להצגה.", "intro": "שיעורי תורה להאזנה מכל מקום.", "hero_kicker": "בית פתוח לפודקאסטים של שיעורי תורה", "hero_cta_primary": "האזנה לפרקים", "hero_cta_secondary": "צירוף פודקאסט", "about": "על Torah Pod", "about_text": "מערכת פתוחה לפרסום שיעורי תורה כפודקאסטים מתוך יוטיוב, Google Drive ופידים קיימים, לאחר אישור.", "how_it_works": "איך זה עובד", "how_it_works_text": "מוסיפים מקור, המערכת מסנכרנת פרקים, והמאזינים מקבלים RSS פתוח שמתאים לאפליקציות הפודקאסטים.", "source_mix": "יוטיוב, Drive ופידים קיימים", "latest_episode": "פרק אחרון", "total_shows": "פודקאסטים", "total_episodes": "פרקים", "language": "English", "updated_at": "עודכן", "hosted_by_torahpod": "מאוחסן ב-Torah Pod", "external_feed": "פיד חיצוני", "mixed_sources": "מקורות משולבים"}, "en": {"dir": "ltr", "lang": "en", "home": "Home", "shows": "Podcasts", "latest": "Latest Episodes", "all_shows": "All Podcasts", "listen": "Listen", "feed": "RSS", "onboard": "Onboard", "status": "Status", "contact": "Contact", "contact_title": "Contact", "contact_text": "Questions, suggestions, or podcast onboarding requests can be sent directly to Torah Pod.", "contact_name": "Name", "contact_email": "Email", "contact_message": "Message", "contact_submit": "Open Email", "donate": "Donate", "donate_title": "Support Torah Pod", "donate_text": "If this project is useful to you, you can help support the platform through Bit or PayBox.", "episodes": "Episodes", "source": "Source", "search": "Search", "search_placeholder": "Search lessons or speakers", "search_podcasts": "Search Podcasts", "search_podcasts_placeholder": "Search by podcast name or rabbi", "podcast_filter": "Filter podcasts", "filter_all": "All", "filter_hosted": "Torah Pod", "filter_external": "External feeds", "search_episodes": "Search Episodes", "search_episodes_placeholder": "Search by lesson title or description", "show_more": "Show More", "empty": "No episodes yet.", "intro": "Torah lessons for listening anywhere.", "hero_kicker": "An open home for Torah lesson podcasts", "hero_cta_primary": "Listen to Episodes", "hero_cta_secondary": "Add a Podcast", "about": "About Torah Pod", "about_text": "An open system for publishing approved Torah lessons as podcasts from YouTube, Google Drive, and existing feeds.", "how_it_works": "How it works", "how_it_works_text": "Add a source, let the system sync episodes, and give listeners an open RSS feed for podcast apps.", "source_mix": "YouTube, Drive, and existing feeds", "latest_episode": "Latest episode", "total_shows": "Podcasts", "total_episodes": "Episodes", "language": "עברית", "updated_at": "Updated", "hosted_by_torahpod": "Hosted by Torah Pod", "external_feed": "External feed", "mixed_sources": "Mixed sources"}};
    const html = document.documentElement;
    const toggle = document.querySelector("[data-language-toggle]");
    function setLanguage(lang) {
      const next = labels[lang] || labels.he;
      html.lang = next.lang;
      html.dir = next.dir;
      document.querySelectorAll("[data-i18n]").forEach((node) => {
        const value = next[node.dataset.i18n];
        if (value) node.innerHTML = value;
      });
      document.querySelectorAll("[data-i18n-placeholder]").forEach((node) => {
        const value = next[node.dataset.i18nPlaceholder];
        if (value) node.setAttribute("placeholder", value);
      });
      localStorage.setItem("torahpod-language", lang);
    }
    toggle?.addEventListener("click", () => {
      setLanguage(html.lang === "he" ? "en" : "he");
    });
    setLanguage(localStorage.getItem("torahpod-language") || "he");
    document.querySelectorAll("[data-list]").forEach((list) => {
      const pageSize = Number(list.dataset.pageSize || "24");
      let visibleLimit = pageSize;
      const controls = document.querySelector(`[data-list-controls="${list.id}"]`);
      const search = document.querySelector(`[data-search-target="${list.id}"]`);
      const filters = Array.from(document.querySelectorAll(`[data-filter-target="${list.id}"]`));
      const more = document.querySelector(`[data-load-more="${list.id}"]`);
      const items = Array.from(list.querySelectorAll("[data-list-item]"));
      if (!items.length) {
        controls?.setAttribute("hidden", "");
        if (more) {
          more.hidden = true;
        }
        return;
      }
      function matches(item) {
        const term = search?.value.trim().toLowerCase() || "";
        const activeFilter = filters.find((filter) => filter.checked)?.value || "all";
        const itemFilter = item.dataset.filterValue || "";
        const matchesTerm = !term || item.dataset.searchItem.toLowerCase().includes(term);
        const matchesFilter =
          activeFilter === "all" ||
          activeFilter === itemFilter ||
          (activeFilter === "hosted_by_torahpod" && itemFilter === "mixed_sources");
        return matchesTerm && matchesFilter;
      }
      function render() {
        const matched = items.filter(matches);
        items.forEach((item) => {
          item.hidden = true;
        });
        matched.slice(0, visibleLimit).forEach((item) => {
          item.hidden = false;
          item.querySelectorAll("audio[data-audio-src]").forEach((audio) => {
            if (!audio.src) {
              audio.src = audio.dataset.audioSrc;
              audio.preload = "metadata";
            }
          });
        });
        if (more) {
          more.hidden = matched.length <= visibleLimit;
        }
      }
      search?.addEventListener("input", () => {
        visibleLimit = pageSize;
        render();
      });
      filters.forEach((filter) => {
        filter.addEventListener("change", () => {
          visibleLimit = pageSize;
          render();
        });
      });
      more?.addEventListener("click", () => {
        visibleLimit += pageSize;
        render();
      });
      render();
    });
    document.querySelectorAll("[data-contact-form]").forEach((form) => {
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const data = new FormData(form);
        const email = form.dataset.contactEmail;
        const subject = html.lang === "en" ? "Torah Pod contact" : "פנייה ל-Torah Pod";
        const lines = [
          `Name: ${data.get("name") || ""}`,
          `Email: ${data.get("email") || ""}`,
          "",
          `${data.get("message") || ""}`,
        ];
        window.location.href = `mailto:${email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(lines.join("\n"))}`;
      });
    });
  </script>
</body>
